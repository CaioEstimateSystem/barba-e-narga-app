<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Barba &amp; Narga</title>
<meta name="description" content="App da casa: agenda, vendas, estoque e resultados.">
<meta name="theme-color" content="#0c0b09">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Barba &amp; Narga">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html,body{margin:0}body{font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>



<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Josefin+Sans:wght@600&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Mesma estrutura do app da Chiq Cell (login dividido, menu lateral + abas no celular, painel, tabelas, janelas).
   Identidade da Barba & Narga: preto e dourado da logo, títulos em serifa clássica, rótulos espaçados como "CLUB SECRETO".
   Escuro é o padrão (é a cara da marca); o botão Tema troca para o claro. */
:root{
  --brand:#c99a45; --brand-ink:#1a1407; --brand-soft:#2a2112; --brand-strong:#e8c780;
  --bg:#0c0b09; --surface:#161410; --surface-2:#1e1b16; --line:#2e2a22;
  --fg:#f2ead8; --muted:#a69b88; --faint:#857b6b; --field:#4a4336; --link:#e8c780;
  --c-lou:#8b6fc9; --c-con:#7d6236; --lou-soft:#231c35; --lou-ink:#c3b2ee;
  --ok:#78bd91; --ok-soft:#142619; --warn:#e6ae52; --warn-soft:#2e2311; --bad:#e67a63; --bad-soft:#2d1712;
  --shadow:0 16px 48px rgba(0,0,0,.6); --glass:rgba(16,14,11,.86);
  --f-display:"Marcellus","Cinzel","Times New Roman",serif;
  --f-label:"Josefin Sans","Futura","Century Gothic",sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,sans-serif;
  --r:14px; --r-sm:10px; --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --brand:#9a6f22; --brand-ink:#ffffff; --brand-soft:#f3e7cf; --brand-strong:#6b4a10;
  --bg:#f5f1e8; --surface:#fffdf8; --surface-2:#f0e9db; --line:#e2d7c2;
  --fg:#1c1813; --muted:#665c4c; --faint:#7d7262; --field:#b3a68e; --link:#7d5713;
  --c-lou:#7a5cc0; --c-con:#d6bf8c; --lou-soft:#ece6f9; --lou-ink:#4f3596;
  --ok:#1b7447; --ok-soft:#e3f2e8; --warn:#8f5a00; --warn-soft:#fbefd8; --bad:#b4372a; --bad-soft:#fbe6e2;
  --shadow:0 16px 48px rgba(60,40,10,.16); --glass:rgba(255,253,248,.86);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.label{font-family:var(--f-label);text-transform:uppercase;letter-spacing:.16em;font-size:11px;color:var(--brand);font-weight:600}
:focus-visible{outline:2px solid var(--brand-strong);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* marca */
.logo{display:flex;align-items:center;gap:12px;color:var(--fg);text-decoration:none}
.logo img{width:46px;height:46px;flex:none}
.logo b{font-family:var(--f-display);font-weight:400;font-size:19px;line-height:1.1;display:block}
.logo span{font-family:var(--f-label);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--brand)}

/* login: selo do Club Secreto (mesma lógica da logo: preto, moldura dourada dupla, anel de texto) */
.login{min-height:100dvh;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);background:var(--bg)}
.seal-side{position:relative;background:#070605;color:#efe6d2;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;gap:36px;
  padding:44px clamp(28px,4vw,64px);isolation:isolate}
.seal-side::before{content:"";position:absolute;inset:18px;border:1px solid rgba(201,154,69,.38);pointer-events:none;z-index:-1}
.seal-side::after{content:"";position:absolute;inset:24px;border:1px solid rgba(201,154,69,.14);pointer-events:none;z-index:-1}
.seal-side .grain{position:absolute;inset:0;z-index:-2;opacity:.5;background:radial-gradient(60% 45% at 50% 42%,rgba(201,154,69,.10),transparent 70%)}
.seal-row{display:flex;align-items:center;gap:14px;font-family:var(--f-label);font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:#c99a45;font-weight:600}
.seal-row i{flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(201,154,69,.55),transparent)}
.seal-mid{display:flex;flex-direction:column;align-items:center;gap:30px;text-align:center}
.seal{position:relative;width:min(360px,62vw);aspect-ratio:1;max-width:100%}
.seal svg{position:absolute;inset:0;width:100%;height:100%;animation:spin 90s linear infinite}
.seal img{position:absolute;inset:9%;width:82%;height:82%;border-radius:50%;box-shadow:0 30px 80px rgba(0,0,0,.9),0 0 0 1px rgba(201,154,69,.25)}
@keyframes spin{to{transform:rotate(360deg)}}
.seal-mid h1{font-size:clamp(34px,3.6vw,52px);line-height:1.05;color:#f3ead6;letter-spacing:.01em}
.seal-mid h1 em{font-style:normal;background:linear-gradient(180deg,#f1d79a 0%,#c99a45 55%,#8c6526 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.pillars{display:grid;grid-template-columns:repeat(3,1fr);width:min(520px,100%)}
.pillar{display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 14px;text-align:center}
.pillar+.pillar{border-left:1px solid rgba(201,154,69,.3)}
.pillar svg{width:26px;height:26px;color:#d9ae5c}
.pillar b{font-family:var(--f-label);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#d9ae5c;font-weight:600}
.pillar span{font-size:13px;color:#a99f8c;line-height:1.35}
.seal-foot{font-size:13px;color:#8d8371;text-align:center}
.login-form{display:grid;place-items:center;padding:40px max(24px,env(safe-area-inset-right,0px)) 40px max(24px,env(safe-area-inset-left,0px))}
.login-card{width:100%;max-width:380px;display:flex;flex-direction:column;gap:20px}
.login-card h2{font-size:40px;line-height:1}
.login-card .lead{color:var(--muted);margin:10px 0 0;font-size:15px}
.who{display:flex;flex-direction:column;gap:8px}
.who small{font-family:var(--f-label);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);font-weight:600}
.who-btn{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer;text-align:left;font:inherit;color:inherit;transition:border-color .15s,background .15s}
.who-btn:hover{border-color:var(--brand);background:var(--surface-2)}
.who-btn .g{flex:1;min-width:0}.who-btn .g b{display:block;font-weight:600}.who-btn .g span{font-size:13px;color:var(--muted)}
.who-btn .go{color:var(--brand);font-size:13px;font-weight:600}
.or{display:flex;align-items:center;gap:12px;color:var(--faint);font-size:13px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
@media (max-width:900px){
  .login{grid-template-columns:1fr}
  .seal-side{padding:36px 28px 34px;gap:22px}
  .seal-side::before{inset:12px}.seal-side::after{inset:17px}
  .seal{width:min(220px,58vw)}
  .seal-mid{gap:20px}
  .seal-mid h1{font-size:30px}
  .pillar{padding:0 8px}.pillar span{display:none}
  .seal-foot{display:none}
}
@media (prefers-reduced-motion:reduce){.seal svg{animation:none}}

/* estrutura */
.app{display:grid;grid-template-columns:256px 1fr;min-height:100dvh}
.side{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100dvh;overflow:auto}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font-family:var(--f-label);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);padding:14px 14px 6px}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 14px;border-radius:12px;color:var(--muted);text-decoration:none;font-weight:600;cursor:pointer;transition:background .15s var(--ease),color .15s var(--ease)}
.nav a:hover{background:var(--surface-2);color:var(--fg)}
.nav a.on{background:var(--brand-soft);color:var(--brand-strong)}
.nav svg{width:20px;height:20px;flex:none}
.nav .count{margin-left:auto;background:var(--bad);color:#fff;border-radius:99px;font-size:12px;padding:1px 8px;font-weight:700}
.me{margin-top:auto;border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.me-row{display:flex;align-items:center;gap:10px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--brand-soft);color:var(--brand-strong);display:grid;place-items:center;font-family:var(--f-display);font-size:17px;flex:none;border:1px solid var(--line)}
.me-name{font-weight:700;line-height:1.2}
.main{min-width:0;padding:32px clamp(16px,3.4vw,48px) 56px;display:flex;flex-direction:column;gap:26px;max-width:1280px}
.topbar,.tabbar{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));background:var(--glass);-webkit-backdrop-filter:saturate(160%) blur(18px);backdrop-filter:saturate(160%) blur(18px);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
  .topbar .logo img{width:40px;height:40px}
  .main{padding:20px max(16px,env(safe-area-inset-right,0px)) 104px max(16px,env(safe-area-inset-left,0px));gap:22px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--glass);-webkit-backdrop-filter:saturate(160%) blur(18px);backdrop-filter:saturate(160%) blur(18px);border-top:1px solid var(--line);padding:6px max(4px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px));z-index:20;justify-content:space-around}
  .tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--faint);text-decoration:none;font-weight:600;padding:4px 6px;min-height:48px;border-radius:10px;cursor:pointer;min-width:0;flex:1}
  .tabbar a.on{color:var(--link)}
  .tabbar svg{width:24px;height:24px}
}

/* cabeçalho de página */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.head h1{font-size:clamp(28px,3vw,38px);line-height:1.08}
.head p{margin:6px 0 0;color:var(--muted);font-size:16px}
.head .actions{display:flex;gap:10px;flex-wrap:wrap}

/* botões e campos */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:10px 18px;min-height:44px;border-radius:99px;font-weight:600;cursor:pointer;white-space:nowrap;transition:border-color .15s var(--ease),transform .15s var(--ease),filter .15s}
.btn:hover{border-color:var(--brand)}
.btn:active{transform:scale(.98)}
.btn.pri{background:linear-gradient(180deg,var(--brand-strong),var(--brand));border-color:var(--brand);color:var(--brand-ink)}
:root[data-theme="light"] .btn.pri{background:var(--brand)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--bad)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#0b1a10}
.btn.sm{padding:6px 14px;min-height:36px;font-size:14px}
.btn.icon{padding:0;width:44px;height:44px}
.btn.sm.icon{width:36px;height:36px}
.btn svg{width:18px;height:18px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600;color:var(--muted);min-width:0}
.in{width:100%;min-height:46px;border:1px solid var(--field);background:var(--bg);border-radius:var(--r-sm);padding:11px 14px;font-size:16px;color:var(--fg);transition:border-color .15s,box-shadow .15s}
.in:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.in::placeholder{color:var(--faint);opacity:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.err{color:var(--bad);font-size:14px;font-weight:600;min-height:18px}
.check{display:flex;gap:10px;align-items:center;font-size:15px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--brand)}

/* superfícies e números */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;min-width:0}
.card h2{font-size:21px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.linkbtn{background:none;border:0;color:var(--link);font:inherit;font-weight:600;font-size:14px;cursor:pointer;min-height:40px;padding:0 4px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:6px;min-width:0;text-align:left;font:inherit;color:inherit}
.kpi .l{font-family:var(--f-label);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--brand);font-weight:600}
.kpi .v{font-family:var(--f-display);font-size:clamp(26px,2.6vw,36px);line-height:1.05;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v small{font-size:.55em;color:var(--muted)}
.kpi .s{font-size:14px;color:var(--muted)}
.kpi.click{cursor:pointer;transition:border-color .15s,transform .2s var(--ease)}
.kpi.click:hover{border-color:var(--brand);transform:translateY(-2px)}
.kpi .go{font-size:14px;font-weight:700;color:var(--link)}
.cols{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;align-items:start}
@media (max-width:1100px){.cols{grid-template-columns:1fr}}
@media (max-width:480px){
  .kpis{grid-template-columns:1fr;gap:10px}
  .kpi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:14px 16px}
  .kpi .l,.kpi .s,.kpi .go{grid-column:1}
  .kpi .v{grid-column:2;grid-row:1/4;font-size:28px;text-align:right}
  .card{padding:18px}
}

/* estados */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:99px;font-size:13px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.nodot::before{display:none}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--brand-soft);color:var(--brand-strong)}
.pill.mute{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill.lou{background:var(--lou-soft);color:var(--lou-ink)}
.tag.tag-lou{color:var(--lou-ink);border-color:var(--c-lou)}
.tag{font-family:var(--f-label);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--brand-strong);border:1px solid var(--line);border-radius:6px;padding:3px 7px;font-weight:600;white-space:nowrap}

/* filtros e tabela */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar .search{flex:1 1 260px;position:relative}
.toolbar .search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--faint)}
.toolbar .search .in{padding-left:42px;border-radius:99px;background:var(--surface)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 16px;min-height:40px;font-size:14px;font-weight:600;cursor:pointer;color:var(--muted)}
.chip.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.chip small{font-weight:500;opacity:.75;margin-left:4px}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-size:13px;color:var(--muted);font-weight:600;padding:14px 18px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:13px 18px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
td.r,th.r{text-align:right}
.pname{font-weight:600}
.psub{color:var(--muted);font-size:14px}
.qty{display:inline-flex;align-items:baseline;gap:4px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.qty small{font-weight:500;color:var(--muted);font-size:13px}
.bar{height:6px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;width:80px;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ok)}
.bar i.warn{background:var(--warn)}.bar i.bad{background:var(--bad)}
.rowact{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.foot{color:var(--muted);font-size:14px}
@media (max-width:700px){
  table.cards thead{display:none}
  table.cards,table.cards tbody,table.cards tr,table.cards td{display:block}
  table.cards tr{padding:12px 16px;border-bottom:1px solid var(--line)}
  table.cards tr:last-child{border-bottom:0}
  table.cards td{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:4px 0!important;border:0;text-align:right}
  table.cards td::before{content:attr(data-label);color:var(--muted);font-size:14px;font-weight:500;text-align:left}
  table.cards td[data-label=""]::before{content:none}
  table.cards td:first-child{justify-content:flex-start;text-align:left;padding-bottom:6px!important}
  table.cards td:first-child::before{content:none}
  table.cards td.act{justify-content:flex-end;padding-top:8px!important}
  table.cards tbody tr:hover td{background:none}
}

/* lista simples */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
button.li{width:100%;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;font:inherit;color:inherit;cursor:pointer;border-radius:0}
button.li:last-child{border-bottom:0}
button.li:hover{background:var(--surface-2)}
.li .ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.li .ic svg{width:18px;height:18px}
.li .ic.in-{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.li .ic.out{background:var(--brand-soft);color:var(--brand-strong);border-color:transparent}
.li .ic.rep{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.li .time{font-family:var(--f-display);font-size:19px;color:var(--brand-strong);width:56px;flex:none}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .d{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* gráfico */

const KEY = 'barbaenarga.app.v5';
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = n => (n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const uid = () => Math.random().toString(36).slice(2,10);
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const parse = s => { const [a,b,c] = s.split('-'); return new Date(+a,+b-1,+c); };
const TODAY = iso(new Date());
const toMin = t => { const [a,b] = t.split(':'); return +a*60 + +b; };
const toT = m => pad(Math.floor(m/60))+':'+pad(m%60);
const DOW = ['dom','seg','ter','qua','qui','sex','sáb'];

/* ---------- regra do lounge ---------- */
const loungeCfg = () => (DB && DB.cfg && DB.cfg.lounge) || LOUNGE_PADRAO;
function periodoDe(ts){
  const d = new Date(ts), c = loungeCfg(), m = d.getHours()*60+d.getMinutes(), ini = toMin(c.inicio), fim = toMin(c.fim);
  if(c.dias.includes(d.getDay()) && m>=ini) return 'lounge';
  if(fim<ini && m<fim && c.dias.includes((d.getDay()+6)%7)) return 'lounge';
  return 'barbearia';
}
function diaDeLounge(ts){
  const d = new Date(ts), c = loungeCfg(), m = d.getHours()*60+d.getMinutes();
  if(c.dias.includes(d.getDay())) return true;
  return toMin(c.fim)<toMin(c.inicio) && m<toMin(c.fim) && c.dias.includes((d.getDay()+6)%7);
}
// Depois da meia-noite, a venda do lounge pertence à noite anterior
function dataOperacional(ts, periodo){
  const d = new Date(ts), c = loungeCfg();
  if(periodo==='lounge' && toMin(c.fim)<toMin(c.inicio) && d.getHours()*60+d.getMinutes() < toMin(c.fim)) return iso(addDays(d,-1));
  return iso(d);
}
function regraLounge(){ const c = loungeCfg(); return `${[1,2,3,4,5,6,0].filter(i=>c.dias.includes(i)).map(i=>DIAS[i].slice(0,3)).join(', ')}, das ${c.inicio} às ${c.fim}`; }

/* ---------- utilitários ---------- */
function toast(msg, undo){
  document.querySelectorAll('.toast').forEach(x=>x.remove());
  const t = document.createElement('div'); t.className='toast'; t.setAttribute('role','status');
  const sp = document.createElement('span'); sp.textContent = msg; t.appendChild(sp);
  if(undo){ const b = document.createElement('button'); b.type='button'; b.className='tb'; b.textContent='Desfazer'; b.onclick=()=>{ t.remove(); undo(); }; t.appendChild(b); }
  document.body.appendChild(t); setTimeout(()=>t.remove(), undo?8000:2600);
}
function modal({title, body, foot, onMount, wide}){
  const bg = document.createElement('div'); bg.className='modal-bg';
  const prev = document.activeElement; const tid = 'mt-'+uid();
  bg.innerHTML = `<div class="modal${wide?' wide':''}" role="dialog" aria-modal="true" aria-labelledby="${tid}" tabindex="-1"><div class="modal-h"><h2 id="${tid}">${esc(title)}</h2><button class="btn ghost icon" data-x aria-label="Fechar">${ICON.x}</button></div><div class="modal-b">${body}</div>${foot?`<div class="modal-f">${foot}</div>`:''}</div>`;
  const close = () => { bg.remove(); document.removeEventListener('keydown', onKey); if(prev && prev.focus && document.contains(prev)) prev.focus(); };
  const onKey = e => { if(e.key==='Escape') close(); };
  document.addEventListener('keydown', onKey);
  let sujo = false; bg.addEventListener('input', ()=>{ sujo = true; });
  bg.addEventListener('click', e => { if(e.target.closest('[data-x]') || (e.target===bg && !sujo)) close(); });
  document.body.appendChild(bg);
  bg.querySelector('.modal').focus();
  onMount && onMount(bg, close);
  return close;
}
function confirmBox(title, text, okLabel, onOk){
  modal({title, body:`<p style="margin:0;color:var(--muted)">${esc(text)}</p>`, foot:`<button class="btn" data-x>Voltar</button><button class="btn pri" id="cf-ok">${esc(okLabel)}</button>`,
    onMount:(el,close)=>{ $('#cf-ok',el).onclick=()=>{ close(); onOk(); }; }});
}

function freeSlots(date, barber, dur, ignoreId){
  const busy = DB.bookings.filter(b=>b.date===date && b.barber===barber && b.status!=='cancelado' && b.id!==ignoreId).map(b=>[toMin(b.time), toMin(b.time)+SV(b.service).dur]);
  const n = new Date(), nowM = n.getHours()*60+n.getMinutes();
  const out = [];
  for(let t=OPEN; t+dur<=CLOSE; t+=30) out.push({t:toT(t), ok: !busy.some(([a,b])=>t<b && t+dur>a) && !(date===TODAY && t<nowM)});
  return out;
}
function moveStock(id, delta, obs){
  const p = prod(id); if(!p) return null;
  p.qtd = Math.max(0, Math.round((p.qtd+delta)*100)/100);
  const m = {id:uid(), prod:id, delta, obs, user:currentUser().id, ts:Date.now()};
  DB.movs.unshift(m); return m;
}
function undoMoves(ms){ ms.forEach(m=>{ if(!m) return; const p = prod(m.prod); if(p) p.qtd = Math.round((p.qtd-m.delta)*100)/100; DB.movs = DB.movs.filter(x=>x.id!==m.id); }); }

// Narga sai por sabor (cada sessão desconta essência, carvão e piteira); bebidas e produtos saem pela unidade
function cardapio(){
  const carvao = prod('carvao')?.qtd||0, pit = prod('piteira')?.qtd||0;
  const narga = DB.produtos.filter(p=>p.ess).map(e=>({key:'n:'+e.id, label:'Narga · '+e.ess, grp:'Narga', preco:NARGA.preco,
    max:Math.min(Math.floor(e.qtd/NARGA.ess), Math.floor(carvao/NARGA.carvao), Math.floor(pit/NARGA.piteira)),
    custo:e.custo*NARGA.ess + (prod('carvao')?.custo||0)*NARGA.carvao + (prod('piteira')?.custo||0)*NARGA.piteira}));
  const outros = DB.produtos.filter(p=>p.preco>0).map(p=>({key:'p:'+p.id, label:p.nome, grp:p.cat||(p.setor==='bar'?'Doses':'Barbearia'), preco:p.preco, max:Math.floor(p.qtd), custo:p.custo}));
  return [...narga, ...outros];
}
function baixarItens(itens, obs){
  const ms = [];
  itens.forEach(i=>{
    const [t,id] = i.key.split(':');
    if(t==='n'){ ms.push(moveStock(id,-NARGA.ess*i.qtd,obs), moveStock('carvao',-NARGA.carvao*i.qtd,obs), moveStock('piteira',-NARGA.piteira*i.qtd,obs)); }
    else ms.push(moveStock(id,-i.qtd,obs));
  });
  return ms;
}

function drawChart(el, dates){
  const days = dates.map(d=>({d, ...stats([d])}));
  const W = Math.max(300, Math.round(el.clientWidth||600)), H = W<480?180:210, pl=58, pb=24, pt=10, iw=W-pl-8, ih=H-pb-pt;
  const max = Math.max(100, ...days.map(d=>d.total)); const top = Math.ceil(max/500)*500;
  const bw = iw/days.length, y = v => pt+ih - v/top*ih, step = Math.ceil(days.length/(W<480?5:10));
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Faturamento por dia">`;
  for(let g=0; g<=4; g++){ const val = top*g/4; s += `<line x1="${pl}" x2="${W-8}" y1="${y(val)}" y2="${y(val)}" stroke="var(--line)"/><text x="${pl-8}" y="${y(val)+4}" text-anchor="end">${val>=1000?(val/1000).toLocaleString('pt-BR')+' mil':val}</text>`; }
  days.forEach((d,i)=>{
    const x = pl+i*bw+bw*.18, w = bw*.64; let acc = 0;
    [['serv','var(--brand)','serviços'],['con','var(--c-con)','consumo'],['lou','var(--c-lou)','lounge']].forEach(([k,c,l])=>{ if(!d[k]) return; const y0 = y(acc), y1 = y(acc+d[k]); s += `<rect x="${x}" y="${y1}" width="${w}" height="${Math.max(0,y0-y1-1)}" rx="2" fill="${c}"><title>${dm(d.d)} · ${l}: ${brl(d[k])}</title></rect>`; acc += d[k]; });
    if((days.length-1-i)%step===0) s += `<text x="${x+w/2}" y="${H-6}" text-anchor="middle">${d.d===TODAY?'hoje':dm(d.d)}</text>`;
  });
  el.innerHTML = s+'</svg>';
}

/* =========================================================
   PEDIDOS: a fila do bar. Novo → Preparando (com quem pegou) → Pronto → Entregue
   ========================================================= */
const PED = {novo:['Novo','warn'], preparando:['Preparando','info'], pronto:['Pronto para levar','ok'], entregue:['Entregue','mute']};
const pedidosAbertos = () => DB.vendas.filter(v=>v.pedido && v.pedido.status!=='entregue');
const minutos = ts => Math.max(0, Math.round((Date.now()-ts)/60e3));
const haQuanto = ts => { const m = minutos(ts); return m<1 ? 'agora' : m<60 ? `há ${m} min` : `há ${Math.floor(m/60)} h ${m%60} min`; };
function renderPedidos(){
  const v = $('#view'), me = currentUser();
  const ab = pedidosAbertos().sort((a,b)=>a.ts-b.ts);
  const col = st => ab.filter(x=>x.pedido.status===st);
  const entregues = DB.vendas.filter(x=>x.pedido && x.pedido.status==='entregue' && x.pedido.ts.entregue && x.date===dataOperacional(Date.now(), periodoDe(Date.now()))).sort((a,b)=>b.pedido.ts.entregue-a.pedido.ts.entregue).slice(0,12);
  const card = x => { const p = x.pedido, m = minutos(p.ts.novo), atrasado = p.status!=='pronto' && m>=10;
    const acao = p.status==='novo' ? `<button class="btn pri" data-pegar="${x.id}">Pegar pedido</button>`
      : p.status==='preparando' ? `<button class="btn pri" data-pronto="${x.id}">${ICON.check}Pronto</button>`
      : `<button class="btn ok" data-entregue="${x.id}">${ICON.check}Entregue</button>`;
    return `<div class="os ped st-${p.status}${atrasado?' late':''}">
      <div class="oshead"><span class="ped-loc">${esc(p.local)}</span><span class="ped-t num${atrasado?' late':''}">${haQuanto(p.ts.novo)}</span></div>
      <ul class="ped-itens">${x.itens.map(i=>`<li><b class="num">${i.qtd}×</b> ${esc(i.label)}</li>`).join('')}</ul>
      <div class="a">Lançado por ${esc(userName(x.user))}${p.resp?` · <b style="color:var(--fg)">${p.resp===me.id?'você pegou':esc(userName(p.resp))+' pegou'}</b>`:''}${x.pay===null?' · cobra no fim do corte':''}</div>
      <div class="acts">${acao}</div></div>`; };
  const lane = (st, titulo, vazio) => `<section class="lane"><h4><span>${titulo}</span><span class="c num">${col(st).length}</span></h4>${col(st).map(card).join('') || `<div class="empty" style="padding:20px 8px">${vazio}</div>`}</section>`;
  v.innerHTML = `
    <div class="head"><div><h1>Pedidos</h1><p>${ab.length?`${plural(ab.length,'pedido','pedidos')} em aberto`:'Nenhum pedido em aberto'} · ${me.pedidos?'você recebe os pedidos do bar':'acompanhe o que o bar está preparando'}</p></div>
      <div class="actions"><button class="btn pri" id="pd-new">${ICON.plus}Novo pedido</button></div></div>
    <div class="lanes ped-lanes">${lane('novo','Novos','Nada novo.')}${lane('preparando','Preparando','Ninguém preparando.')}${lane('pronto','Prontos para levar','Nada esperando.')}</div>
    <section class="card"><div class="card-h"><h2>Entregues</h2><span class="psub">${entregues.length?'os mais recentes':'nenhum ainda'}</span></div>
      <div class="list">${entregues.map(x=>`<div class="li"><span class="time num" style="font-size:16px;width:50px">${hm(x.pedido.ts.entregue)}</span><div class="grow"><div class="t">${esc(itensTxt(x))}</div><div class="d">${esc(x.pedido.local)}${x.pedido.resp?` · ${esc(userName(x.pedido.resp))}`:''} · ${Math.max(1,Math.round((x.pedido.ts.entregue-x.pedido.ts.novo)/60e3))} min do pedido à entrega</div></div></div>`).join('') || '<div class="empty">Os pedidos entregues aparecem aqui.</div>'}</div></section>`;
  $('#pd-new').onclick = () => vendaDialog();
  const mover = (id, para, msg) => { const x = DB.vendas.find(y=>y.id===id), p = x.pedido, prev = JSON.parse(JSON.stringify(p));
    p.status = para; p.ts[para] = Date.now(); if(para==='preparando') p.resp = me.id;
    save(); refresh(); toast(msg, ()=>{ x.pedido = prev; save(); refresh(); }); };
  v.querySelectorAll('[data-pegar]').forEach(b=>b.onclick=()=>mover(b.dataset.pegar,'preparando','Pedido é seu. Bom trabalho!'));
  v.querySelectorAll('[data-pronto]').forEach(b=>b.onclick=()=>mover(b.dataset.pronto,'pronto','Pronto para levar'));
  v.querySelectorAll('[data-entregue]').forEach(b=>b.onclick=()=>mover(b.dataset.entregue,'entregue','Pedido entregue'));
}

/* ---------- aviso de pedido novo para quem cuida do bar ---------- */
const conhecidos = new Set(DB.vendas.filter(v=>v.pedido).map(v=>v.id));
function beep(){
  try{ const c = window._ac || (window._ac = new (window.AudioContext||window.webkitAudioContext)()); [0,.18].forEach(d=>{ const o = c.createOscillator(), g = c.createGain(); o.frequency.value = 880; g.gain.setValueAtTime(.0001,c.currentTime+d); g.gain.exponentialRampToValueAtTime(.25,c.currentTime+d+.02); g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+d+.15); o.connect(g); g.connect(c.destination); o.start(c.currentTime+d); o.stop(c.currentTime+d+.16); }); }catch(e){}
  try{ navigator.vibrate && navigator.vibrate([150,80,150]); }catch(e){}
}
function avisarNovos(){
  const me = currentUser(); if(!me) return;
  const novos = DB.vendas.filter(v=>v.pedido && v.pedido.status==='novo' && !conhecidos.has(v.id));
  novos.forEach(v=>conhecidos.add(v.id));
  if(novos.length && me.pedidos){ beep(); toast(`Pedido novo · ${novos[0].pedido.local}: ${itensTxt(novos[0])}`); }
}
// Outra aba ou outro login no mesmo aparelho lançou algo: atualiza a tela na hora
function sincronizar(){
  let raw = null; try{ raw = localStorage.getItem(KEY); }catch(e){ return; }
  if(!raw || raw===ultimoSalvo) return;
  try{ const d = JSON.parse(raw); if(d && d.ver===4){ DB = d; ultimoSalvo = raw; avisarNovos(); if(!document.querySelector('.modal-bg')) render(); } }catch(e){}
}
window.addEventListener('storage', e=>{ if(e.key===KEY) sincronizar(); });
setInterval(()=>{ sincronizar(); if(UI.route==='pedidos' && currentUser() && !document.querySelector('.modal-bg') && UI.mode==='app') renderPedidos(); }, 15000);

  v.querySelectorAll('#es-s [data-s]').forEach(b=>b.onclick=()=>{ UI.estSetor=b.dataset.s; refresh(); });

function itemDialog(id){

    <div class="msum"><span class="psub">${SETOR[p.setor]} · mínimo ${fmtQ(p.min)} ${esc(p.unid)}</span><span class="big num">${fmtQ(p.qtd)} ${esc(p.unid)}</span></div>

      segBind(el,'#it-m',x=>{ modo=x; upd(); });

          <p class="psub" style="margin:-4px 0 12px">Vendas nesse horário contam como lounge. Fora dele, contam como barbearia. Depois da meia-noite, até o horário de fim, ainda é a noite anterior.</p>
          <div class="chips" id="lg-d">${[5,6,0,1,2,3,4].map(i=>`<button type="button" class="chip ${c.dias.includes(i)?'on':''}" data-d="${i}" aria-pressed="${c.dias.includes(i)}">${DIAS[i]}</button>`).join('')}</div>
          <div class="grid2" style="margin-top:12px"><label class="f">Começa às<input class="in num" type="time" id="lg-i" value="${c.inicio}"></label><label class="f">Termina às<input class="in num" type="time" id="lg-f" value="${c.fim}"></label></div>
          <div style="margin-top:12px"><button class="btn pri" id="lg-ok">Salvar horário</button></div></section>
        <section class="card"><div class="card-h"><h2>Agendamento do cliente</h2></div>
          <p class="psub" style="margin:-4px 0 12px">Página onde o cliente escolhe serviço, barbeiro e horário livre. Coloque o link na bio do Instagram e na resposta automática do WhatsApp.</p>
          <button class="btn" id="lk-open">${ICON.link}Ver como o cliente vê</button></section>
      </div>
    </div>`;
  $('#us-new').onclick = () => userDialog(null);
  v.querySelectorAll('[data-us]').forEach(r=>r.onclick=()=>userDialog(r.dataset.us));
  $('#sv-new').onclick = () => svcDialog(null);
  v.querySelectorAll('[data-sv]').forEach(b=>b.onclick=()=>svcDialog(b.dataset.sv));
  $('#lk-open').onclick = openCliente;
  const dias = new Set(c.dias);
  v.querySelectorAll('#lg-d [data-d]').forEach(b=>b.onclick=()=>{ const i = +b.dataset.d; dias.has(i)?dias.delete(i):dias.add(i); b.classList.toggle('on',dias.has(i)); b.setAttribute('aria-pressed',String(dias.has(i))); });
  $('#lg-ok').onclick = () => {
    const ini = $('#lg-i').value, fim = $('#lg-f').value;
    if(!dias.size){ toast('Escolha pelo menos um dia de lounge'); return; }
    if(!ini || !fim){ toast('Preencha o horário de começo e de fim'); return; }
    const prev = {...loungeCfg()};
    DB.cfg.lounge = {dias:[...dias], inicio:ini, fim};
    save(); refresh(); toast(`Lounge: ${regraLounge()}`, ()=>{ DB.cfg.lounge = prev; save(); refresh(); });
  };
}
function userDialog(id){
  const me = currentUser(), self = id===me.id;
  const u = id ? DB.users.find(x=>x.id===id) : {nome:'',usuario:'',senha:'',papel:'funcionario',funcao:'Barbeiro',com:50,ativo:true};
  let papel = u.papel;
  modal({title: id?'Editar login':'Novo login', body:`
    <div class="grid2"><label class="f">Nome<input class="in" id="u-n" value="${esc(u.nome)}"></label><label class="f">Função<input class="in" id="u-f" value="${esc(u.funcao)}" placeholder="Barbeiro, Lounge e bar"></label></div>
    <div class="grid2"><label class="f">Usuário<input class="in" id="u-u" autocapitalize="none" value="${esc(u.usuario)}"></label><label class="f">Senha<input class="in" id="u-s" value="${esc(u.senha)}"></label></div>
    <div class="f"><span class="psub" style="font-weight:600">Tipo de acesso</span><div class="seg" id="u-p"><button type="button" data-v="funcionario" class="${papel==='funcionario'?'on':''}" ${self?'disabled':''}>Funcionário</button><button type="button" data-v="dono" class="${papel==='dono'?'on':''}">Dono</button></div>
      ${self?'<span class="note">Você não pode tirar o seu próprio acesso de dono.</span>':''}</div>
    <label class="f">Comissão sobre serviços (%)<input class="in num" id="u-c" inputmode="numeric" value="${u.com}"></label>
    <label class="check"><input type="checkbox" id="u-ped" ${u.pedidos?'checked':''}> Recebe os pedidos do bar (abre na fila e avisa quando chega pedido)</label>
    ${id&&!self?`<label class="check"><input type="checkbox" id="u-a" ${u.ativo?'checked':''}> Acesso ativo</label>`:''}
    <div class="err" id="u-err"></div>`,
    foot:`<button class="btn" data-x>Voltar</button><button class="btn pri" id="u-ok">Salvar</button>`,
    onMount:(el,close)=>{
      segBind(el,'#u-p',x=>papel=x);
      $('#u-ok',el).onclick=()=>{
        const d = {nome:$('#u-n',el).value.trim(), funcao:$('#u-f',el).value.trim()||'Funcionário', usuario:$('#u-u',el).value.trim().toLowerCase(), senha:$('#u-s',el).value, com:Math.round(numIn($('#u-c',el).value)), papel, pedidos:$('#u-ped',el).checked};
        if(!d.nome || !d.usuario){ $('#u-err',el).textContent='Preencha nome e usuário.'; return; }
        if(d.senha.length<4){ $('#u-err',el).textContent='A senha precisa de pelo menos 4 caracteres.'; return; }
        if(DB.users.some(x=>x.usuario===d.usuario && x.id!==id)){ $('#u-err',el).textContent='Esse usuário já existe. Escolha outro.'; return; }
        if(id){ Object.assign(u,d); if($('#u-a',el)) u.ativo = $('#u-a',el).checked; } else DB.users.push({id:uid(), ativo:true, ...d});
        save(); close(); refresh(); toast('Login salvo');
      };
    }});
}
function svcDialog(id){
  const s = id ? SV(id) : {nome:'',preco:0,dur:30};
  modal({title:id?'Editar serviço':'Novo serviço', body:`
    <label class="f">Nome<input class="in" id="sv-n" value="${esc(s.nome)}" placeholder="Ex.: Corte infantil"></label>
    <div class="grid2"><label class="f">Preço (R$)<input class="in num" id="sv-p" inputmode="decimal" value="${String(s.preco).replace('.',',')}"></label>
    <label class="f">Duração<select class="in" id="sv-d">${[30,60,90,120].map(d=>`<option value="${d}" ${s.dur===d?'selected':''}>${d} min</option>`).join('')}</select></label></div>
    <div class="err" id="sv-err"></div>`,
    foot:`<button class="btn" data-x>Voltar</button><button class="btn pri" id="sv-ok">Salvar</button>`,
    onMount:(el,close)=>{ $('#sv-ok',el).onclick=()=>{ const n = $('#sv-n',el).value.trim(); if(!n){ $('#sv-err',el).textContent='Dê um nome ao serviço.'; return; }
      const d = {nome:n, preco:numIn($('#sv-p',el).value), dur:+$('#sv-d',el).value};
      if(id) Object.assign(s,d); else DB.services.push({id:uid(),...d}); save(); close(); refresh(); toast('Serviço salvo'); }; }});
}

/* =========================================================
   PÁGINA DO CLIENTE: serviço → barbeiro → horário → dados
   ========================================================= */
let CLI;
function resetCli(){ CLI = {step:0, service:null, barber:'any', date:TODAY, time:null, nome:'', tel:'', done:null}; }
resetCli();
function openCliente(){ resetCli(); UI.mode='cliente'; try{ history.replaceState(null,'','#agendar'); }catch(e){} render(); window.scrollTo(0,0); }
function closeCliente(){ UI.mode='app'; try{ history.replaceState(null,'','#'+(UI.route||'')); }catch(e){} render(); window.scrollTo(0,0); }
function clientePageHTML(){
  return `<div class="cli-page"><div class="cli-wrap"><div class="cli-top"><img src="${LOGO}" alt="Barba &amp; Narga · Club Secreto"><span class="label">Agende seu horário</span></div><div id="cli"></div>
    <button class="backlink" id="cli-exit" style="align-self:center">${currentUser()?'Voltar ao app da equipe':'Área da equipe'}</button></div></div>`;
}
function drawCli(){
  const el = $('#cli'); if(!el) return;
  const c = CLI;
  if($('#cli-exit')) $('#cli-exit').onclick = closeCliente;
  if(c.done){ const b = c.done;
    el.innerHTML = `<div class="cli"><span class="label">Tudo certo</span><h2>Horário confirmado</h2>
      <dl class="kv"><dt>Serviço</dt><dd>${esc(SV(b.service).nome)}</dd><dt>Barbeiro</dt><dd>${esc(userName(b.barber))}</dd><dt>Quando</dt><dd>${dayLabel(b.date)} às ${b.time}</dd><dt>Valor</dt><dd>${brl(b.valor)}</dd><dt>Nome</dt><dd>${esc(b.cliente)}</dd></dl>
      <p class="psub" style="margin:0">Chegue 5 minutos antes e aproveite o lounge enquanto espera.</p>
      <button class="btn pri block" id="cl-again">Agendar outro horário</button></div>`;
    $('#cl-again').onclick = ()=>{ resetCli(); drawCli(); }; return; }
  const steps = `<div class="steps">${[0,1,2,3].map(i=>`<i class="${i<=c.step?'on':''}"></i>`).join('')}</div>`;
  const back = c.step>0 ? `<button class="backlink" id="cl-back">← Voltar</button>` : '';
  let b = '';
  if(c.step===0) b = `<h2>Qual serviço?</h2><div class="stack" style="gap:8px">${DB.services.map(s=>`<button class="svc" data-s="${s.id}"><div class="g"><b>${esc(s.nome)}</b><span>${s.dur} min</span></div><span class="pr num">${brl(s.preco)}</span></button>`).join('')}</div>`;
  else if(c.step===1) b = `<h2>Com quem?</h2><div class="stack" style="gap:8px"><button class="svc" data-b="any"><span class="avatar">★</span><div class="g"><b>Primeiro disponível</b><span>Mostra todos os horários livres</span></div></button>${barbers().map(u=>`<button class="svc" data-b="${u.id}"><span class="avatar">${initial(u.nome)}</span><div class="g"><b>${esc(u.nome)}</b><span>Barbeiro</span></div></button>`).join('')}</div>`;
  else if(c.step===2){
    const dur = SV(c.service).dur, pool = c.barber==='any' ? barbers().map(u=>u.id) : [c.barber];
    const by = pool.map(id=>freeSlots(c.date,id,dur)); const sl = by[0].map((s,i)=>({t:s.t, ok:by.some(a=>a[i].ok)}));
    b = `<h2>Quando?</h2><div class="days">${[...Array(7)].map((_,i)=>{ const d = iso(addDays(new Date(),i)), x = parse(d); return `<button class="day ${d===c.date?'on':''}" data-d="${d}"><span>${d===TODAY?'hoje':DOW[x.getDay()]}</span><b class="num">${x.getDate()}</b></button>`; }).join('')}</div>
      ${sl.some(s=>s.ok)?`<div class="slots">${sl.map(s=>`<button class="slot num ${c.time===s.t?'on':''}" data-t="${s.t}" ${s.ok?'':'disabled'}>${s.t}</button>`).join('')}</div>`:'<div class="empty">Sem horário livre neste dia. Escolha outra data.</div>'}
      <button class="btn pri block" id="cl-next" ${c.time?'':'disabled'}>Continuar</button>`;
  } else b = `<h2>Seus dados</h2>
      <div class="msum"><div><b>${esc(SV(c.service).nome)}</b><div class="psub">${dayLabel(c.date)} às ${c.time} · ${c.barber==='any'?'primeiro disponível':esc(userName(c.barber))}</div></div><span class="big num">${brl(SV(c.service).preco)}</span></div>
      <label class="f">Nome<input class="in" id="cl-n" autocomplete="name" value="${esc(c.nome)}" placeholder="Como te chamamos?"></label>
      <label class="f">WhatsApp<input class="in" id="cl-t" inputmode="tel" autocomplete="tel" value="${esc(c.tel)}" placeholder="(21) 99999-9999"></label>
      <div class="err" id="cl-err"></div>
      <button class="btn pri block" id="cl-ok">Confirmar agendamento</button>`;
  el.innerHTML = `<div class="cli">${steps}${back}${b}</div>`;
  if($('#cl-back')) $('#cl-back').onclick = ()=>{ c.step--; drawCli(); };
  el.querySelectorAll('[data-s]').forEach(x=>x.onclick=()=>{ c.service=x.dataset.s; c.step=1; drawCli(); });
  el.querySelectorAll('[data-b]').forEach(x=>x.onclick=()=>{ c.barber=x.dataset.b; c.time=null; c.step=2; drawCli(); });
  el.querySelectorAll('[data-d]').forEach(x=>x.onclick=()=>{ c.date=x.dataset.d; c.time=null; drawCli(); });
  el.querySelectorAll('[data-t]').forEach(x=>x.onclick=()=>{ c.time=x.dataset.t; drawCli(); });
  if($('#cl-next')) $('#cl-next').onclick = ()=>{ c.step=3; drawCli(); };
  if($('#cl-ok')) $('#cl-ok').onclick = ()=>{
    c.nome = $('#cl-n').value.trim(); c.tel = $('#cl-t').value.trim();
    if(!c.nome){ $('#cl-err').textContent='Escreva o seu nome.'; return; }
    if(c.tel.replace(/\D/g,'').length<10){ $('#cl-err').textContent='Informe o WhatsApp com DDD.'; return; }
    const sv = SV(c.service); let bb = c.barber;
    if(bb==='any'){ const i = freeSlots(c.date,'-',sv.dur).findIndex(s=>s.t===c.time); bb = (barbers().find(u=>freeSlots(c.date,u.id,sv.dur)[i].ok) || barbers()[0]).id; }
    const bk = {id:uid(),date:c.date,time:c.time,barber:bb,cliente:c.nome,tel:c.tel,service:sv.id,valor:sv.preco,status:'agendado',origem:'cliente'};
    DB.bookings.push(bk); save(); c.done = bk; drawCli();
  };
}
let _rz; window.addEventListener('resize', ()=>{ clearTimeout(_rz); _rz = setTimeout(()=>{ const el = $('#ch'); if(el) drawChart(el, datasDo(UI.rng)); },150); });

render();
</script>

<title>Barba &amp; Narga App</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0c0b09">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Josefin+Sans:wght@600&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Mesma estrutura do app da Chiq Cell (login dividido, menu lateral + abas no celular, painel, tabelas, janelas).
   Identidade da Barba & Narga: preto e dourado da logo, títulos em serifa clássica, rótulos espaçados como "CLUB SECRETO".
   Escuro é o padrão (é a cara da marca); o botão Tema troca para o claro. */
:root{
  --brand:#c99a45; --brand-ink:#1a1407; --brand-soft:#2a2112; --brand-strong:#e8c780;
  --bg:#0c0b09; --surface:#161410; --surface-2:#1e1b16; --line:#2e2a22;
  --fg:#f2ead8; --muted:#a69b88; --faint:#857b6b; --field:#4a4336; --link:#e8c780;
  --c-lou:#8b6fc9; --c-con:#7d6236; --lou-soft:#231c35; --lou-ink:#c3b2ee;
  --ok:#78bd91; --ok-soft:#142619; --warn:#e6ae52; --warn-soft:#2e2311; --bad:#e67a63; --bad-soft:#2d1712;
  --shadow:0 16px 48px rgba(0,0,0,.6); --glass:rgba(16,14,11,.86);
  --f-display:"Marcellus","Cinzel","Times New Roman",serif;
  --f-label:"Josefin Sans","Futura","Century Gothic",sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,sans-serif;
  --r:14px; --r-sm:10px; --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --brand:#9a6f22; --brand-ink:#ffffff; --brand-soft:#f3e7cf; --brand-strong:#6b4a10;
  --bg:#f5f1e8; --surface:#fffdf8; --surface-2:#f0e9db; --line:#e2d7c2;
  --fg:#1c1813; --muted:#665c4c; --faint:#7d7262; --field:#b3a68e; --link:#7d5713;
  --c-lou:#7a5cc0; --c-con:#d6bf8c; --lou-soft:#ece6f9; --lou-ink:#4f3596;
  --ok:#1b7447; --ok-soft:#e3f2e8; --warn:#8f5a00; --warn-soft:#fbefd8; --bad:#b4372a; --bad-soft:#fbe6e2;
  --shadow:0 16px 48px rgba(60,40,10,.16); --glass:rgba(255,253,248,.86);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.label{font-family:var(--f-label);text-transform:uppercase;letter-spacing:.16em;font-size:11px;color:var(--brand);font-weight:600}
:focus-visible{outline:2px solid var(--brand-strong);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* marca */
.logo{display:flex;align-items:center;gap:12px;color:var(--fg);text-decoration:none}
.logo img{width:46px;height:46px;flex:none}
.logo b{font-family:var(--f-display);font-weight:400;font-size:19px;line-height:1.1;display:block}
.logo span{font-family:var(--f-label);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--brand)}

/* login: selo do Club Secreto (mesma lógica da logo: preto, moldura dourada dupla, anel de texto) */
.login{min-height:100dvh;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);background:var(--bg)}
.seal-side{position:relative;background:#070605;color:#efe6d2;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;gap:36px;
  padding:44px clamp(28px,4vw,64px);isolation:isolate}
.seal-side::before{content:"";position:absolute;inset:18px;border:1px solid rgba(201,154,69,.38);pointer-events:none;z-index:-1}
.seal-side::after{content:"";position:absolute;inset:24px;border:1px solid rgba(201,154,69,.14);pointer-events:none;z-index:-1}
.seal-side .grain{position:absolute;inset:0;z-index:-2;opacity:.5;background:radial-gradient(60% 45% at 50% 42%,rgba(201,154,69,.10),transparent 70%)}
.seal-row{display:flex;align-items:center;gap:14px;font-family:var(--f-label);font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:#c99a45;font-weight:600}
.seal-row i{flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(201,154,69,.55),transparent)}
.seal-mid{display:flex;flex-direction:column;align-items:center;gap:30px;text-align:center}
.seal{position:relative;width:min(360px,62vw);aspect-ratio:1;max-width:100%}
.seal svg{position:absolute;inset:0;width:100%;height:100%;animation:spin 90s linear infinite}
.seal img{position:absolute;inset:9%;width:82%;height:82%;border-radius:50%;box-shadow:0 30px 80px rgba(0,0,0,.9),0 0 0 1px rgba(201,154,69,.25)}
@keyframes spin{to{transform:rotate(360deg)}}
.seal-mid h1{font-size:clamp(34px,3.6vw,52px);line-height:1.05;color:#f3ead6;letter-spacing:.01em}
.seal-mid h1 em{font-style:normal;background:linear-gradient(180deg,#f1d79a 0%,#c99a45 55%,#8c6526 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.pillars{display:grid;grid-template-columns:repeat(3,1fr);width:min(520px,100%)}
.pillar{display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 14px;text-align:center}
.pillar+.pillar{border-left:1px solid rgba(201,154,69,.3)}
.pillar svg{width:26px;height:26px;color:#d9ae5c}
.pillar b{font-family:var(--f-label);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#d9ae5c;font-weight:600}
.pillar span{font-size:13px;color:#a99f8c;line-height:1.35}
.seal-foot{font-size:13px;color:#8d8371;text-align:center}
.login-form{display:grid;place-items:center;padding:40px max(24px,env(safe-area-inset-right,0px)) 40px max(24px,env(safe-area-inset-left,0px))}
.login-card{width:100%;max-width:380px;display:flex;flex-direction:column;gap:20px}
.login-card h2{font-size:40px;line-height:1}
.login-card .lead{color:var(--muted);margin:10px 0 0;font-size:15px}
.who{display:flex;flex-direction:column;gap:8px}
.who small{font-family:var(--f-label);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);font-weight:600}
.who-btn{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer;text-align:left;font:inherit;color:inherit;transition:border-color .15s,background .15s}
.who-btn:hover{border-color:var(--brand);background:var(--surface-2)}
.who-btn .g{flex:1;min-width:0}.who-btn .g b{display:block;font-weight:600}.who-btn .g span{font-size:13px;color:var(--muted)}
.who-btn .go{color:var(--brand);font-size:13px;font-weight:600}
.or{display:flex;align-items:center;gap:12px;color:var(--faint);font-size:13px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
@media (max-width:900px){
  .login{grid-template-columns:1fr}
  .seal-side{padding:36px 28px 34px;gap:22px}
  .seal-side::before{inset:12px}.seal-side::after{inset:17px}
  .seal{width:min(220px,58vw)}
  .seal-mid{gap:20px}
  .seal-mid h1{font-size:30px}
  .pillar{padding:0 8px}.pillar span{display:none}
  .seal-foot{display:none}
}
@media (prefers-reduced-motion:reduce){.seal svg{animation:none}}

/* estrutura */
.app{display:grid;grid-template-columns:256px 1fr;min-height:100dvh}
.side{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100dvh;overflow:auto}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font-family:var(--f-label);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);padding:14px 14px 6px}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 14px;border-radius:12px;color:var(--muted);text-decoration:none;font-weight:600;cursor:pointer;transition:background .15s var(--ease),color .15s var(--ease)}
.nav a:hover{background:var(--surface-2);color:var(--fg)}
.nav a.on{background:var(--brand-soft);color:var(--brand-strong)}
.nav svg{width:20px;height:20px;flex:none}
.nav .count{margin-left:auto;background:var(--bad);color:#fff;border-radius:99px;font-size:12px;padding:1px 8px;font-weight:700}
.me{margin-top:auto;border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.me-row{display:flex;align-items:center;gap:10px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--brand-soft);color:var(--brand-strong);display:grid;place-items:center;font-family:var(--f-display);font-size:17px;flex:none;border:1px solid var(--line)}
.me-name{font-weight:700;line-height:1.2}
.main{min-width:0;padding:32px clamp(16px,3.4vw,48px) 56px;display:flex;flex-direction:column;gap:26px;max-width:1280px}
.topbar,.tabbar{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));background:var(--glass);-webkit-backdrop-filter:saturate(160%) blur(18px);backdrop-filter:saturate(160%) blur(18px);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
  .topbar .logo img{width:40px;height:40px}
  .main{padding:20px max(16px,env(safe-area-inset-right,0px)) 104px max(16px,env(safe-area-inset-left,0px));gap:22px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--glass);-webkit-backdrop-filter:saturate(160%) blur(18px);backdrop-filter:saturate(160%) blur(18px);border-top:1px solid var(--line);padding:6px max(4px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px));z-index:20;justify-content:space-around}
  .tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--faint);text-decoration:none;font-weight:600;padding:4px 6px;min-height:48px;border-radius:10px;cursor:pointer;min-width:0;flex:1}
  .tabbar a.on{color:var(--link)}
  .tabbar svg{width:24px;height:24px}
}

/* cabeçalho de página */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.head h1{font-size:clamp(28px,3vw,38px);line-height:1.08}
.head p{margin:6px 0 0;color:var(--muted);font-size:16px}
.head .actions{display:flex;gap:10px;flex-wrap:wrap}

/* botões e campos */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:10px 18px;min-height:44px;border-radius:99px;font-weight:600;cursor:pointer;white-space:nowrap;transition:border-color .15s var(--ease),transform .15s var(--ease),filter .15s}
.btn:hover{border-color:var(--brand)}
.btn:active{transform:scale(.98)}
.btn.pri{background:linear-gradient(180deg,var(--brand-strong),var(--brand));border-color:var(--brand);color:var(--brand-ink)}
:root[data-theme="light"] .btn.pri{background:var(--brand)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--bad)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#0b1a10}
.btn.sm{padding:6px 14px;min-height:36px;font-size:14px}
.btn.icon{padding:0;width:44px;height:44px}
.btn.sm.icon{width:36px;height:36px}
.btn svg{width:18px;height:18px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600;color:var(--muted);min-width:0}
.in{width:100%;min-height:46px;border:1px solid var(--field);background:var(--bg);border-radius:var(--r-sm);padding:11px 14px;font-size:16px;color:var(--fg);transition:border-color .15s,box-shadow .15s}
.in:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.in::placeholder{color:var(--faint);opacity:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.err{color:var(--bad);font-size:14px;font-weight:600;min-height:18px}
.check{display:flex;gap:10px;align-items:center;font-size:15px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--brand)}

/* superfícies e números */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;min-width:0}
.card h2{font-size:21px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.linkbtn{background:none;border:0;color:var(--link);font:inherit;font-weight:600;font-size:14px;cursor:pointer;min-height:40px;padding:0 4px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:6px;min-width:0;text-align:left;font:inherit;color:inherit}
.kpi .l{font-family:var(--f-label);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--brand);font-weight:600}
.kpi .v{font-family:var(--f-display);font-size:clamp(26px,2.6vw,36px);line-height:1.05;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v small{font-size:.55em;color:var(--muted)}
.kpi .s{font-size:14px;color:var(--muted)}
.kpi.click{cursor:pointer;transition:border-color .15s,transform .2s var(--ease)}
.kpi.click:hover{border-color:var(--brand);transform:translateY(-2px)}
.kpi .go{font-size:14px;font-weight:700;color:var(--link)}
.cols{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;align-items:start}
@media (max-width:1100px){.cols{grid-template-columns:1fr}}
@media (max-width:480px){
  .kpis{grid-template-columns:1fr;gap:10px}
  .kpi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:14px 16px}
  .kpi .l,.kpi .s,.kpi .go{grid-column:1}
  .kpi .v{grid-column:2;grid-row:1/4;font-size:28px;text-align:right}
  .card{padding:18px}
}

/* estados */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:99px;font-size:13px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.nodot::before{display:none}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--brand-soft);color:var(--brand-strong)}
.pill.mute{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill.lou{background:var(--lou-soft);color:var(--lou-ink)}
.tag.tag-lou{color:var(--lou-ink);border-color:var(--c-lou)}
.tag{font-family:var(--f-label);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--brand-strong);border:1px solid var(--line);border-radius:6px;padding:3px 7px;font-weight:600;white-space:nowrap}

/* filtros e tabela */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar .search{flex:1 1 260px;position:relative}
.toolbar .search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--faint)}
.toolbar .search .in{padding-left:42px;border-radius:99px;background:var(--surface)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 16px;min-height:40px;font-size:14px;font-weight:600;cursor:pointer;color:var(--muted)}
.chip.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.chip small{font-weight:500;opacity:.75;margin-left:4px}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-size:13px;color:var(--muted);font-weight:600;padding:14px 18px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:13px 18px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
td.r,th.r{text-align:right}
.pname{font-weight:600}
.psub{color:var(--muted);font-size:14px}
.qty{display:inline-flex;align-items:baseline;gap:4px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:360px){.pill{white-space:normal}.li .grow{min-width:0}.li .grow .t,.li .grow .d{overflow-wrap:anywhere}}
.qty small{font-weight:500;color:var(--muted);font-size:13px}
.bar{height:6px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;width:80px;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ok)}
.bar i.warn{background:var(--warn)}.bar i.bad{background:var(--bad)}
.rowact{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.foot{color:var(--muted);font-size:14px}
@media (max-width:700px){
  table.cards thead{display:none}
  table.cards,table.cards tbody,table.cards tr,table.cards td{display:block}
  table.cards tr{padding:12px 16px;border-bottom:1px solid var(--line)}
  table.cards tr:last-child{border-bottom:0}
  table.cards td{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:4px 0!important;border:0;text-align:right}
  table.cards td::before{content:attr(data-label);color:var(--muted);font-size:14px;font-weight:500;text-align:left}
  table.cards td[data-label=""]::before{content:none}
  table.cards td:first-child{justify-content:flex-start;text-align:left;padding-bottom:6px!important}
  table.cards td:first-child::before{content:none}
  table.cards td.act{justify-content:flex-end;padding-top:8px!important}
  table.cards tbody tr:hover td{background:none}
}

/* lista simples */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
button.li{width:100%;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;font:inherit;color:inherit;cursor:pointer;border-radius:0}
button.li:last-child{border-bottom:0}
button.li:hover{background:var(--surface-2)}
.li .ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.li .ic svg{width:18px;height:18px}
.li .ic.in-{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.li .ic.out{background:var(--brand-soft);color:var(--brand-strong);border-color:transparent}
.li .ic.rep{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.li .time{font-family:var(--f-display);font-size:19px;color:var(--brand-strong);width:56px;flex:none}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .d{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* gráfico */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-body);font-size:12px}
.legend{display:flex;gap:16px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* agenda em colunas por barbeiro (mesma lógica do quadro de reparos da Chiq) */
.lanes{display:grid;gap:12px;overflow-x:auto;padding-bottom:4px}
.lane{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}

<script>
/* =========================================================
   Barba & Narga · Club Secreto — app da casa (protótipo v2)
   Cinco telas, cada uma com um trabalho só:
   Resultados (dono) · Agenda · Vendas · Estoque · Ajustes (dono)
   Estrutura: DB (dados) → PERMS (papéis) → ROUTES (telas)
   ========================================================= */
const LOGO = "__LOGO__";
const KEY = 'barbaenarga.app.v6';
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = n => (n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const uid = () => Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-6);
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const parse = s => { const [a,b,c] = s.split('-'); return new Date(+a,+b-1,+c); };
const TODAY = iso(new Date());
const toMin = t => { const [a,b] = t.split(':'); return +a*60 + +b; };
const toT = m => pad(Math.floor(m/60))+':'+pad(m%60);
const DOW = ['dom','seg','ter','qua','qui','sex','sáb'];
const DIAS = ['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
const hm = ts => new Date(ts).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
const fmtDT = ts => new Date(ts).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const dm = s => { const d = parse(s); return `${d.getDate()}/${pad(d.getMonth()+1)}`; };
const dayLabel = s => { if(s===TODAY) return 'Hoje'; if(s===iso(addDays(new Date(),1))) return 'Amanhã'; return parse(s).toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'}); };
const numIn = v => parseFloat(String(v).replace(/\./g,'').replace(',','.')) || 0;
const fmtQ = q => (Math.round(q*100)/100).toLocaleString('pt-BR');
const plural = (n,a,b) => `${n} ${n===1?a:b}`;
const HORARIO_PADRAO = {abre:'09:00', fecha:'21:00', fechado:[1]};
const NARGA_PADRAO = {preco:60, ess:15, carvao:3, piteira:1};
// Lidos da configuração da casa (Ajustes); valem os padrões até o dono mudar
const NARGA = { get preco(){ return cfgNarga().preco; }, get ess(){ return cfgNarga().ess; }, get carvao(){ return cfgNarga().carvao; }, get piteira(){ return cfgNarga().piteira; } };
const H = { get open(){ return toMin(cfgHorario().abre); }, get close(){ return toMin(cfgHorario().fecha); }, get fechado(){ return cfgHorario().fechado||[]; } };
const cfgNarga = () => ({...NARGA_PADRAO, ...((typeof DB!=='undefined' && DB && DB.cfg && DB.cfg.narga)||{})});
const cfgHorario = () => ({...HORARIO_PADRAO, ...((typeof DB!=='undefined' && DB && DB.cfg && DB.cfg.horario)||{})});
const PAYS = ['Pix','Cartão','Dinheiro'];
const SETOR = {barbearia:'Barbearia', tabacaria:'Tabacaria', bar:'Bar'};
const LOUNGE_PADRAO = {dias:[5,6,0], inicio:'20:00', fim:'03:00'};

/* ---------- ícones ---------- */
const I = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const ICON = {
  resultados: I('<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'),
  agenda: I('<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>'),
  vendas: I('<path d="M6 7h12l-1 13H7z"/><path d="M9 7a3 3 0 0 1 6 0"/>'),
  estoque: I('<path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>'),
  pedidos: I('<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/>'),
  ajustes: I('<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>'),
  barbearia: I('<rect x="8" y="2.5" width="8" height="19" rx="3"/><path d="M8 7l8 4M8 12l8 4M8 17l3 1.5"/>'),
  tabacaria: I('<path d="M12 3c1.5 1.2 1.5 2.5 0 3.5"/><path d="M9 8h6l-1 3h-4z"/><path d="M12 11v4"/><path d="M8 21h8l-1-6H9z"/><path d="M15 17c3 0 4-1.5 4-3.5"/>'),
  bar: I('<path d="M5 4h14l-1.5 15a2 2 0 0 1-2 1.8h-7a2 2 0 0 1-2-1.8z"/><rect x="8.5" y="10" width="3.5" height="3.5" rx=".8"/><rect x="12" y="12" width="3.5" height="3.5" rx=".8"/>'),
  plus: I('<path d="M12 5v14M5 12h14"/>'),
  minus: I('<path d="M5 12h14"/>'),
  search: I('<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>'),
  x: I('<path d="M6 6l12 12M18 6L6 18"/>'),
  out: I('<path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h11"/>'),
  lock: I('<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>'),
  check: I('<path d="M5 12.5l4.5 4.5L19 7"/>'),
  moon: I('<path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/>'),
  chev: I('<path d="M9 5l7 7-7 7"/>'),
  link: I('<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>'),
};

/* ---------- papéis e permissões ---------- */
const PAPEIS = { dono:'Dono', funcionario:'Funcionário' };
const PERMS = { dono:['*'], funcionario:['agenda','pedidos','vendas','estoque'] };
// Só o dono: resultados, ajustes, valores (custos, totais da casa, comissões dos outros), editar_produto
const can = p => { const u = currentUser(); if(!u) return false; const ps = PERMS[u.papel]||[]; return ps.includes('*') || ps.includes(p); };

/* ---------- regra do lounge ---------- */
const loungeCfg = () => (DB && DB.cfg && DB.cfg.lounge) || LOUNGE_PADRAO;
function periodoDe(ts){
  const d = new Date(ts), c = loungeCfg(), m = d.getHours()*60+d.getMinutes(), ini = toMin(c.inicio), fim = toMin(c.fim);
  if(c.dias.includes(d.getDay()) && m>=ini) return 'lounge';
  if(fim<ini && m<fim && c.dias.includes((d.getDay()+6)%7)) return 'lounge';
  return 'barbearia';
}
function diaDeLounge(ts){
  const d = new Date(ts), c = loungeCfg(), m = d.getHours()*60+d.getMinutes();
  if(c.dias.includes(d.getDay())) return true;
  return toMin(c.fim)<toMin(c.inicio) && m<toMin(c.fim) && c.dias.includes((d.getDay()+6)%7);
}

/* =========================================================
   DADOS: dois modos
   - demonstração: dados de exemplo neste aparelho, renovados todo dia
   - oficial: dados da casa na nuvem (Supabase), iguais em todos os celulares
   Um aparelho entra no modo oficial ao abrir o link de conexão que o dono compartilha.
   ========================================================= */
const NUVEM = {url:'__SB_URL__', key:'__SB_KEY__', casa:'barbaenarga'};
const temNuvem = () => /^(https:\/\/|http:\/\/127\.0\.0\.1:)/.test(NUVEM.url) && NUVEM.key.length>20;
const KEY_DEMO = KEY, KEY_OF = 'barbaenarga.oficial.v1', KEY_SEG = 'barbaenarga.segredo';
let SEGREDO = null;
try{ SEGREDO = localStorage.getItem(KEY_SEG); }catch(e){}
// link de conexão: ...#conectar=<código>
try{ const m = location.hash.match(/^#conectar=([A-Za-z0-9_-]{8,80})$/); if(m){ SEGREDO = m[1]; localStorage.setItem(KEY_SEG, SEGREDO); history.replaceState(null,'',location.pathname); } }catch(e){}
const MODO = (temNuvem() && SEGREDO) ? 'oficial' : 'demo';
const oficial = () => MODO==='oficial';
const digitando = () => { const a = document.activeElement; return !!(a && a.matches && a.matches('#root input, #root textarea, #root select')); };
const COLS = ['users','services','produtos','bookings','vendas','movs'];
const vazio = () => ({ver:4, users:[], services:[], produtos:[], bookings:[], vendas:[], movs:[], cfg:{}});

let DB;
let ultimoSalvo = null;
// ---- estado da sincronização (modo oficial) ----
const SYNC = { shadow:{}, pendentes:{}, desde:'1970-01-01T00:00:00.000000Z', pronto:false, online:true, erro:null, enviando:false, timer:null, ultimaPuxada:0 };
const chave = (col,id) => col+'/'+id;
function serial(col, r){
  if(col==='produtos'){ const {qtd, ...resto} = r; return resto; } // a quantidade é calculada pelas movimentações
  if(col==='users'){ const {senha, ...resto} = r; return resto; }    // senha nunca vai em texto
  return r;
}
function recalcEstoque(){
  if(!oficial()) return;
  const soma = {}; DB.movs.forEach(m=>{ soma[m.prod] = (soma[m.prod]||0) + m.delta; });
  DB.produtos.forEach(p=>{ p.qtd = Math.max(0, Math.round(((p.qtd0||0) + (soma[p.id]||0))*100)/100); });
}
function guardarCache(){
  try{ localStorage.setItem(KEY_OF, JSON.stringify({DB, shadow:SYNC.shadow, pendentes:SYNC.pendentes, desde:SYNC.desde})); }catch(e){}
}
function load(){
  if(oficial()){
    try{ const c = JSON.parse(localStorage.getItem(KEY_OF)||'null'); if(c && c.DB){ DB = c.DB; SYNC.shadow = c.shadow||{}; SYNC.pendentes = c.pendentes||{}; SYNC.desde = c.desde||SYNC.desde; SYNC.pronto = true; } }catch(e){}
    if(!DB) DB = vazio();
    COLS.forEach(c=>{ if(!Array.isArray(DB[c])) DB[c] = []; }); if(!DB.cfg) DB.cfg = {};
    recalcEstoque();
    return;
  }
  try{ const raw = localStorage.getItem(KEY_DEMO); const d = JSON.parse(raw||'null'); if(d && d.ver===4 && d.seededFor===TODAY){ DB = d; ultimoSalvo = raw; return; } }catch(e){}
  DB = seed(); save();
}
function save(){
  if(!oficial()){ try{ ultimoSalvo = JSON.stringify(DB); localStorage.setItem(KEY_DEMO, ultimoSalvo); }catch(e){} return; }
  // compara cada registro com a última versão sincronizada e marca o que mudou
  const vistos = new Set();
  COLS.forEach(col=>DB[col].forEach(r=>{ const k = chave(col,r.id); vistos.add(k); const d = serial(col,r), j = JSON.stringify(d); if(SYNC.shadow[k]!==j) SYNC.pendentes[k] = {col, id:r.id, data:d, deleted:false}; }));
  const kc = chave('cfg','main'); vistos.add(kc); const jc = JSON.stringify(DB.cfg||{}); if(SYNC.shadow[kc]!==jc && (Object.keys(DB.cfg||{}).length || SYNC.shadow[kc])) SYNC.pendentes[kc] = {col:'cfg', id:'main', data:DB.cfg||{}, deleted:false};
  Object.keys(SYNC.shadow).forEach(k=>{ if(!vistos.has(k)){ const [col, ...rest] = k.split('/'); SYNC.pendentes[k] = {col, id:rest.join('/'), data:{}, deleted:true}; } });
  guardarCache(); agendarEnvio(300);
}
async function rpc(fn, args){
  const h = {'Content-Type':'application/json', apikey:NUVEM.key};
  if(!/^sb_/.test(NUVEM.key)) h.Authorization = 'Bearer '+NUVEM.key;
  const r = await fetch(`${NUVEM.url}/rest/v1/rpc/${fn}`, {method:'POST', headers:h, body:JSON.stringify(args)});
  const txt = await r.text(); let j = null; try{ j = txt ? JSON.parse(txt) : null; }catch(e){}
  if(!r.ok){ const e = new Error((j && (j.message||j.hint)) || ('HTTP '+r.status)); e.status = r.status; e.code = j && j.code; throw e; }
  return j;
}
function agendarEnvio(ms){ clearTimeout(SYNC.timer); SYNC.timer = setTimeout(enviar, ms); }
async function enviar(){
  if(!oficial() || SYNC.enviando) return;
  const lote = Object.entries(SYNC.pendentes).slice(0,200);
  if(!lote.length) return;
  SYNC.enviando = true;
  try{
    await rpc('sync_enviar', {p_casa:NUVEM.casa, p_segredo:SEGREDO, p_linhas:lote.map(([,v])=>v)});
    lote.forEach(([k,v])=>{ if(SYNC.pendentes[k]===v){ delete SYNC.pendentes[k]; if(v.deleted) delete SYNC.shadow[k]; else SYNC.shadow[k] = JSON.stringify(v.data); } });
    SYNC.online = true; SYNC.erro = null; guardarCache();
    if(Object.keys(SYNC.pendentes).length) agendarEnvio(50);
  }catch(e){
    SYNC.online = false; SYNC.erro = e; if(e.code==='28000' || /segredo/i.test(e.message)) codigoInvalido();
    agendarEnvio(5000);
  }finally{ SYNC.enviando = false; pintarSync(); }
}
async function puxar(){
  if(!oficial()) return;
  try{
    let mudou = false, rodadas = 0;
    while(rodadas++ < 50){
      const linhas = await rpc('sync_puxar', {p_casa:NUVEM.casa, p_segredo:SEGREDO, p_desde:SYNC.desde, p_folga:rodadas===1}) || [];
      linhas.forEach(l=>{
        if(l.updated_at > SYNC.desde) SYNC.desde = l.updated_at;
        const k = chave(l.col,l.id);
        if(SYNC.pendentes[k]) return;                      // alteração local ainda não enviada vence
        const j = JSON.stringify(l.data);
        if(l.deleted){ if(!(k in SYNC.shadow)) return; delete SYNC.shadow[k]; if(l.col==='cfg') return; DB[l.col] = (DB[l.col]||[]).filter(r=>r.id!==l.id); mudou = true; return; }
        if(SYNC.shadow[k]===j) return;
        SYNC.shadow[k] = j; mudou = true;
        if(l.col==='cfg'){ DB.cfg = l.data||{}; return; }
        if(!DB[l.col]) return;
        const i = DB[l.col].findIndex(r=>r.id===l.id);
        if(i>=0) DB[l.col][i] = {...l.data}; else DB[l.col].push({...l.data});
      });
      if(linhas.length < 1000) break;
    }
    const primeira = !SYNC.pronto; SYNC.pronto = true; SYNC.online = true; SYNC.erro = null; SYNC.ultimaPuxada = Date.now();
    if(mudou || primeira){ recalcEstoque(); guardarCache(); avisarNovos(primeira); if(!document.querySelector('.modal-bg') && !digitando()) render(); }
  }catch(e){
    SYNC.online = false; SYNC.erro = e; if(e.code==='28000' || /segredo/i.test(e.message)) codigoInvalido();
    if(!SYNC.pronto){ render(); }
  }
  pintarSync();
}
function codigoInvalido(){
  try{ localStorage.removeItem(KEY_SEG); localStorage.removeItem(KEY_OF); }catch(e){}
  alertaFixo('O link de conexão deste aparelho não vale mais. Peça ao dono um link novo.');
}
function alertaFixo(msg){ let b = document.getElementById('alerta-fixo'); if(!b){ b = document.createElement('div'); b.id = 'alerta-fixo'; b.className = 'alerta-fixo'; document.body.prepend(b); } b.textContent = msg; }
function pintarSync(){
  document.querySelectorAll('[data-sync]').forEach(el=>{

async function hashSenha(userId, senha){
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(`${NUVEM.casa}:${userId}:${senha}`));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}

function moveStock(id, delta, obs){

// Narga sai por sabor (cada sessão desconta essência, carvão e piteira); bebidas e produtos saem pela unidade
function cardapio(){
  const carvao = prod('carvao') ? prod('carvao').qtd : Infinity, pit = prod('piteira') ? prod('piteira').qtd : Infinity;
  const narga = DB.produtos.filter(p=>p.ess).map(e=>({key:'n:'+e.id, label:'Narga · '+e.ess, grp:'Narga', preco:NARGA.preco,
    max:Math.min(Math.floor(e.qtd/NARGA.ess), Math.floor(carvao/NARGA.carvao), Math.floor(pit/NARGA.piteira)),
    custo:e.custo*NARGA.ess + (prod('carvao')?.custo||0)*NARGA.carvao + (prod('piteira')?.custo||0)*NARGA.piteira}));
  const outros = DB.produtos.filter(p=>p.preco>0).map(p=>({key:'p:'+p.id, label:p.nome, grp:p.cat||(p.setor==='bar'?'Doses':'Barbearia'), preco:p.preco, max:Math.floor(p.qtd), custo:p.custo}));
  return [...narga, ...outros];
}
function baixarItens(itens, obs){
  const ms = [];
  itens.forEach(i=>{
    const [t,id] = i.key.split(':');
    if(t==='n'){ ms.push(moveStock(id,-NARGA.ess*i.qtd,obs), moveStock('carvao',-NARGA.carvao*i.qtd,obs), moveStock('piteira',-NARGA.piteira*i.qtd,obs)); }
    else ms.push(moveStock(id,-i.qtd,obs));
  });
  return ms;
}

function datasDo(rng){ const n = rng==='hoje'?1:rng==='7d'?7:30; return [...Array(n)].map((_,i)=>iso(addDays(new Date(),i-n+1))); }
function stats(dates){
  const set = new Set(dates);
  const done = DB.bookings.filter(b=>set.has(b.date) && b.status==='concluido');
  const vs = DB.vendas.filter(v=>set.has(v.date));
  const vB = vs.filter(v=>v.periodo==='barbearia'), vL = vs.filter(v=>v.periodo==='lounge');
  const serv = done.reduce((a,b)=>a+b.valor,0), con = somaV(vB), lou = somaV(vL);
  return {done, vs, vB, vL, serv, con, barb:serv+con, lou, total:serv+con+lou};
}

function drawChart(el, dates){
  const days = dates.map(d=>({d, ...stats([d])}));
  const W = Math.max(300, Math.round(el.clientWidth||600)), H = W<480?180:210, pl=58, pb=24, pt=10, iw=W-pl-8, ih=H-pb-pt;
  const max = Math.max(100, ...days.map(d=>d.total)); const top = Math.ceil(max/500)*500;
  const bw = iw/days.length, y = v => pt+ih - v/top*ih, step = Math.ceil(days.length/(W<480?5:10));
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Faturamento por dia">`;
  for(let g=0; g<=4; g++){ const val = top*g/4; s += `<line x1="${pl}" x2="${W-8}" y1="${y(val)}" y2="${y(val)}" stroke="var(--line)"/><text x="${pl-8}" y="${y(val)+4}" text-anchor="end">${val>=1000?(val/1000).toLocaleString('pt-BR')+' mil':val}</text>`; }
  days.forEach((d,i)=>{
    const x = pl+i*bw+bw*.18, w = bw*.64; let acc = 0;
    [['serv','var(--brand)','serviços'],['con','var(--c-con)','consumo'],['lou','var(--c-lou)','lounge']].forEach(([k,c,l])=>{ if(!d[k]) return; const y0 = y(acc), y1 = y(acc+d[k]); s += `<rect x="${x}" y="${y1}" width="${w}" height="${Math.max(0,y0-y1-1)}" rx="2" fill="${c}"><title>${dm(d.d)} · ${l}: ${brl(d[k])}</title></rect>`; acc += d[k]; });
    if((days.length-1-i)%step===0) s += `<text x="${x+w/2}" y="${H-6}" text-anchor="middle">${d.d===TODAY?'hoje':dm(d.d)}</text>`;
  });
  el.innerHTML = s+'</svg>';
}

    onMount:(el,close)=>{

      if($('#ap-fin',el)) $('#ap-fin',el).onclick=()=>{ close(); finishDialog(id); };
      if($('#ap-cancel',el)) $('#ap-cancel',el).onclick=()=>{ close();
        const aberto = DB.vendas.filter(x=>x.booking===b.id && x.pay===null);
        if(aberto.length){ toast(`${b.cliente} tem ${brl(somaV(aberto))} de consumo em aberto. Conclua o atendimento para cobrar.`); return; }
        confirmBox('Cancelar horário?', `O horário das ${b.time} com ${userName(b.barber)} volta a ficar livre.`, 'Cancelar horário', ()=>{ b.status='cancelado'; save(); refresh(); toast('Horário cancelado', ()=>{ b.status='agendado'; save(); refresh(); }); }); };
    }});
}
// Concluir = cobrar o serviço + o que o cliente consumiu, num pagamento só. O consumo conta para a barbearia.
function finishDialog(id){
  const b = DB.bookings.find(x=>x.id===id); let pay = null; const cart = {}; let getItens, consTot = 0;
  const naConta = DB.vendas.filter(x=>x.booking===b.id && x.pay===null);
  const jaPedido = somaV(naConta);
  const upd = () => { $('#fi-tot').textContent = brl(numIn($('#fi-val').value) + jaPedido + consTot); };
  modal({title:`Concluir · ${b.cliente}`, wide:true, body:`
    <p class="psub" style="margin:0">${esc(SV(b.service).nome)} com ${esc(userName(b.barber))}</p>
    <label class="f">Valor do serviço (R$)<input class="in num" id="fi-val" inputmode="decimal" value="${String(b.valor).replace('.',',')}"></label>
    ${naConta.length?`<div class="msum"><div><span class="psub">Já pedido para a cadeira</span><div style="font-weight:600">${esc(naConta.map(itensTxt).join(', '))}</div></div><span class="big num">${brl(jaPedido)}</span></div>`:''}
    <div class="f"><span class="psub" style="font-weight:600">${naConta.length?'Consumiu mais alguma coisa?':'O cliente consumiu algo?'} <span style="font-weight:400">(opcional · entra como barbearia)</span></span>${cartHTML()}</div>
    <div class="f"><span class="psub" style="font-weight:600">Pagamento</span><div class="seg" id="fi-pay">${PAYS.map(p=>`<button type="button" data-v="${p}">${p}</button>`).join('')}</div></div>
    ${prod('p3')||prod('p6')?`<label class="check"><input type="checkbox" id="fi-cons" checked> Dar baixa de ${[prod('p3')&&'1 lâmina',prod('p6')&&'1 toalha descartável'].filter(Boolean).join(' e ')}</label>`:''}
    <div class="msum"><span class="psub">Total a cobrar</span><span class="big num" id="fi-tot"></span></div>
    <div class="err" id="fi-err"></div>`,
    foot:`<button class="btn" data-x>Voltar</button><button class="btn pri" id="fi-ok">${ICON.check}Concluir e registrar</button>`,
    onMount:(el,close)=>{
      getItens = cartMount(el, cart, t=>{ consTot = t; if($('#fi-tot',el)) upd(); });
      $('#fi-val',el).oninput = upd; upd();
      segBind(el,'#fi-pay',x=>{ pay=x; $('#fi-err',el).textContent=''; });
      $('#fi-ok',el).onclick=()=>{
        if(!pay){ $('#fi-err',el).textContent='Escolha a forma de pagamento.'; return; }
        const prev = {...b}; const itens = getItens();
        b.status='concluido'; b.pay=pay; b.valor=numIn($('#fi-val',el).value)||b.valor;
        const ms = ($('#fi-cons',el) && $('#fi-cons',el).checked) ? [moveStock('p3',-1,'Atendimento de '+b.cliente), moveStock('p6',-1,'Atendimento de '+b.cliente)].filter(Boolean) : [];
        let venda = null;
        if(itens.length){ ms.push(...baixarItens(itens,'Consumo de '+b.cliente)); const t = Date.now(); venda = {id:uid(),date:TODAY,ts:t,periodo:'barbearia',user:currentUser().id,pay,itens,booking:b.id,total:itens.reduce((a,i)=>a+i.preco*i.qtd,0),pedido:{status:'entregue',local:`Cadeira do ${userName(b.barber)} · ${b.cliente}`,resp:currentUser().id,ts:{novo:t,entregue:t}}}; DB.vendas.push(venda); conhecidos.add(venda.id); }
        naConta.forEach(x=>x.pay = pay);
        save(); close(); refresh();
        toast(`Concluído · ${brl(b.valor+jaPedido+(venda?venda.total:0))} no ${pay}`, ()=>{ Object.assign(b,prev); naConta.forEach(x=>x.pay = null); if(venda) DB.vendas = DB.vendas.filter(x=>x.id!==venda.id); undoMoves(ms); save(); refresh(); });
      };
    }});
}
function slotOpts(date, barber, svc){
  const sl = freeSlots(date, barber, SV(svc).dur).filter(s=>s.ok);
  return sl.length ? sl.map(s=>`<option>${s.t}</option>`).join('') : '<option value="">Sem horário livre neste dia</option>';
}
function slotOptsSel(date, barber, svc, ignoreId, atual){
  const sl = freeSlots(date, barber, SV(svc).dur, ignoreId).filter(s=>s.ok);
  if(atual && !sl.some(s=>s.t===atual)) sl.unshift({t:atual});
  return sl.length ? sl.map(s=>`<option ${s.t===atual?'selected':''}>${s.t}</option>`).join('') : `<option value="">${H.fechado.includes(parse(date).getDay())?'Fechado neste dia':'Sem horário livre neste dia'}</option>`;
}
// Novo horário (no balcão) ou remarcar um existente
function newApptDialog(editId){
  const u = currentUser(), bk = editId ? DB.bookings.find(x=>x.id===editId) : null;
  if(!barbers().length){ toast(can('*')?'Cadastre um barbeiro em Ajustes antes de marcar horários':'Nenhum barbeiro cadastrado. Fale com o dono.'); return; }
  if(!DB.services.length){ toast('Cadastre os serviços em Ajustes antes de marcar horários'); return; }
  const defB = bk ? bk.barber : isBarber(u) ? u.id : (UI.agBarber!=='all' ? UI.agBarber : barbers()[0].id);
  const defS = bk ? bk.service : DB.services[0].id;
  const defD = bk ? bk.date : (UI.agDate < TODAY ? TODAY : UI.agDate);
  const dias = [...Array(14)].map((_,i)=>iso(addDays(new Date(),i))); if(!dias.includes(defD)) dias.unshift(defD);
  modal({title: bk ? `Remarcar · ${bk.cliente}` : 'Novo horário', body:`
    <div class="grid2"><label class="f">Cliente<input class="in" id="na-c" placeholder="Nome do cliente" value="${esc(bk?bk.cliente:'')}"></label>
    <label class="f">WhatsApp<input class="in" id="na-t" inputmode="tel" placeholder="(21) 99999-9999" value="${esc(bk?bk.tel||'':'')}"></label></div>
    <label class="f">Serviço<select class="in" id="na-s">${DB.services.map(s=>`<option value="${s.id}" ${s.id===defS?'selected':''}>${esc(s.nome)} · ${s.dur} min · ${brl(s.preco)}</option>`).join('')}</select></label>
    <div class="grid2"><label class="f">Barbeiro<select class="in" id="na-b">${barbers().map(b=>`<option value="${b.id}" ${b.id===defB?'selected':''}>${esc(b.nome)}</option>`).join('')}</select></label>
    <label class="f">Dia<select class="in" id="na-d">${dias.map(d=>`<option value="${d}" ${d===defD?'selected':''}>${dayLabel(d)}${H.fechado.includes(parse(d).getDay())?' · fechado':''}</option>`).join('')}</select></label></div>
    <label class="f">Horário livre<select class="in" id="na-h">${slotOptsSel(defD, defB, defS, editId, bk&&bk.date===defD&&bk.barber===defB?bk.time:null)}</select></label>
    <div class="err" id="na-err"></div>`,
    foot:`<button class="btn" data-x>Voltar</button><button class="btn pri" id="na-ok">${bk?'Salvar novo horário':'Marcar horário'}</button>`,
    onMount:(el,close)=>{
      const upd = () => { const d = $('#na-d',el).value, b = $('#na-b',el).value; $('#na-h',el).innerHTML = slotOptsSel(d, b, $('#na-s',el).value, editId, bk&&bk.date===d&&bk.barber===b?bk.time:null); };
      ['#na-s','#na-b','#na-d'].forEach(s=>$(s,el).onchange=upd);
      $('#na-ok',el).onclick=()=>{
        const c = $('#na-c',el).value.trim(), t = $('#na-h',el).value;
        if(!c){ $('#na-err',el).textContent='Escreva o nome do cliente.'; return; }
        if(!t){ $('#na-err',el).textContent='Escolha um horário livre ou mude o dia.'; return; }
        const s = SV($('#na-s',el).value);
        const dados = {date:$('#na-d',el).value, time:t, barber:$('#na-b',el).value, cliente:c, tel:$('#na-t',el).value.trim(), service:s.id, valor:s.preco};
        if(bk){ const prev = {...bk}; Object.assign(bk, dados); UI.agDate = bk.date; save(); close(); refresh();
          toast(`Remarcado: ${c}, ${dayLabel(bk.date).toLowerCase()} às ${t}`, ()=>{ Object.assign(bk, prev); save(); refresh(); }); return; }
        const b = {id:uid(), ...dados, status:'agendado', origem:'balcao'};
        DB.bookings.push(b); UI.agDate = b.date; save(); close(); refresh();
        toast(`Marcado: ${c}, ${dayLabel(b.date).toLowerCase()} às ${t}`, ()=>{ DB.bookings = DB.bookings.filter(x=>x.id!==b.id); save(); refresh(); });
      };
    }});
}

  const hojeOp = dataOperacional(Date.now(), agora);
  const vs = DB.vendas.filter(x=>x.date===hojeOp).sort((a,b)=>b.ts-a.ts);
  const vB = vs.filter(x=>x.periodo==='barbearia'), vL = vs.filter(x=>x.periodo==='lounge');
  const status = agora==='lounge' ? `<span class="pill lou">Lounge aberto · vendas contam para o lounge</span>`
    : diaDeLounge(Date.now()) ? `<span class="pill mute">Horário da barbearia · lounge abre às ${loungeCfg().inicio}</span>`
    : `<span class="pill mute">Horário da barbearia · hoje não tem lounge</span>`;
  const lista = (arr) => arr.length ? `<div class="list">${arr.map(x=>`<div class="li${dono?' click':''}" ${dono?`data-vd="${x.id}" role="button" tabindex="0"`:''}><span class="time num" style="font-size:16px;width:50px">${hm(x.ts)}</span><div class="grow"><div class="t">${esc(itensTxt(x))}</div><div class="d">${x.booking?`Consumo de ${esc((DB.bookings.find(b=>b.id===x.booking)||{}).cliente||'cliente')} · `:''}${x.pay===null?'cobra no fim do corte':esc(x.pay)} · ${esc(userName(x.user))}</div></div>${x.pedido&&x.pedido.status!=='entregue'?`<span class="pill ${PED[x.pedido.status][1]}">${PED[x.pedido.status][0]}</span>`:''}<span class="qty">${brl(x.total)}</span></div>`).join('')}</div>` : '<div class="empty">Nenhuma venda.</div>';
  v.innerHTML = `
    <div class="head"><div><h1>Vendas</h1><p>${status}</p></div>
      <div class="actions"><button class="btn" id="vd-ped">${ICON.pedidos}Ver pedidos${pedidosAbertos().length?` (${pedidosAbertos().length})`:''}</button><button class="btn pri" id="vd-new">${ICON.plus}Nova venda</button></div></div>
    <div class="cols even">
      <section class="card"><div class="card-h"><h2>Barbearia</h2>${dono?`<span class="qty">${brl(somaV(vB))}</span>`:''}</div>
        <p class="psub" style="margin:-4px 0 8px">Vendas de hoje fora do lounge, inclusive consumo durante o corte.</p>${lista(vB)}</section>
      <section class="card"><div class="card-h"><h2>Lounge</h2>${dono?`<span class="qty">${brl(somaV(vL))}</span>`:''}</div>
        <p class="psub" style="margin:-4px 0 8px">Vendas da noite (${regraLounge()}).</p>${lista(vL)}</section>
    </div>
    <p class="note" style="margin:0">Toda venda vira um pedido na tela Pedidos, para quem cuida do bar pegar e preparar. Cada narga vendida desconta ${NARGA.ess} g da essência, ${NARGA.carvao} cubos de carvão e ${NARGA.piteira} piteira do estoque.</p>`;
  $('#vd-new').onclick = () => vendaDialog();
  $('#vd-ped').onclick = () => go('pedidos');
  v.querySelectorAll('[data-vd]').forEach(r=>r.onclick=()=>vendaDetalhe(r.dataset.vd));

// Dono pode cancelar uma venda lançada errada: o estoque volta e a venda sai dos resultados
function vendaDetalhe(id){
  const x = DB.vendas.find(v=>v.id===id); if(!x) return;
  const bk = x.booking && DB.bookings.find(b=>b.id===x.booking);
  modal({title:'Venda', body:`<dl class="kv">
      <dt>Itens</dt><dd>${esc(itensTxt(x))}</dd><dt>Total</dt><dd>${brl(x.total)}</dd>
      <dt>Quando</dt><dd>${fmtDT(x.ts)} · ${x.periodo==='lounge'?'lounge':'barbearia'}</dd>
      <dt>Pagamento</dt><dd>${x.pay===null?'cobra no fim do corte':esc(x.pay)}</dd>
      <dt>Lançado por</dt><dd>${esc(userName(x.user))}</dd>
      ${bk?`<dt>Cliente</dt><dd>${esc(bk.cliente)}</dd>`:''}
      ${x.pedido?`<dt>Pedido</dt><dd>${PED[x.pedido.status][0]}${x.pedido.local?' · '+esc(x.pedido.local):''}</dd>`:''}</dl>`,
    foot:`<button class="btn danger" id="vd-cancel">Cancelar venda</button><button class="btn" data-x>Fechar</button>`,
    onMount:(el,close)=>{ $('#vd-cancel',el).onclick = () => { close(); confirmBox('Cancelar esta venda?', `${itensTxt(x)} (${brl(x.total)}) sai dos resultados e os itens voltam para o estoque.`, 'Cancelar venda', ()=>{
      const ms = [];
      x.itens.forEach(i=>{ const [t,pid] = i.key.split(':'); if(t==='n'){ ms.push(moveStock(pid, NARGA.ess*i.qtd, 'Venda cancelada'), moveStock('carvao', NARGA.carvao*i.qtd, 'Venda cancelada'), moveStock('piteira', NARGA.piteira*i.qtd, 'Venda cancelada')); } else ms.push(moveStock(pid, i.qtd, 'Venda cancelada')); });
      const idx = DB.vendas.indexOf(x); DB.vendas.splice(idx,1); save(); refresh();
      toast('Venda cancelada', ()=>{ DB.vendas.splice(idx,0,x); undoMoves(ms); save(); refresh(); });
    }); }; }});
}

/* =========================================================
   PEDIDOS: a fila do bar. Novo → Preparando (com quem pegou) → Pronto → Entregue
   ========================================================= */
const PED = {novo:['Novo','warn'], preparando:['Preparando','info'], pronto:['Pronto para levar','ok'], entregue:['Entregue','mute']};
const pedidosAbertos = () => DB.vendas.filter(v=>v.pedido && v.pedido.status!=='entregue');
const minutos = ts => Math.max(0, Math.round((Date.now()-ts)/60e3));
const haQuanto = ts => { const m = minutos(ts); return m<1 ? 'agora' : m<60 ? `há ${m} min` : `há ${Math.floor(m/60)} h ${m%60} min`; };
function renderPedidos(){
  const v = $('#view'), me = currentUser();
  const ab = pedidosAbertos().sort((a,b)=>a.ts-b.ts);
  const col = st => ab.filter(x=>x.pedido.status===st);
  const entregues = DB.vendas.filter(x=>x.pedido && x.pedido.status==='entregue' && x.pedido.ts.entregue && x.date===dataOperacional(Date.now(), periodoDe(Date.now()))).sort((a,b)=>b.pedido.ts.entregue-a.pedido.ts.entregue).slice(0,12);
  const card = x => { const p = x.pedido, m = minutos(p.ts.novo), atrasado = p.status!=='pronto' && m>=10;
    const acao = p.status==='novo' ? `<button class="btn pri" data-pegar="${x.id}">Pegar pedido</button>`
      : p.status==='preparando' ? `<button class="btn pri" data-pronto="${x.id}">${ICON.check}Pronto</button>`
      : `<button class="btn ok" data-entregue="${x.id}">${ICON.check}Entregue</button>`;
    return `<div class="os ped st-${p.status}${atrasado?' late':''}">
      <div class="oshead"><span class="ped-loc">${esc(p.local)}</span><span class="ped-t num${atrasado?' late':''}">${haQuanto(p.ts.novo)}</span></div>
      <ul class="ped-itens">${x.itens.map(i=>`<li><b class="num">${i.qtd}×</b> ${esc(i.label)}</li>`).join('')}</ul>
      <div class="a">Lançado por ${esc(userName(x.user))}${p.resp?` · <b style="color:var(--fg)">${p.resp===me.id?'você pegou':esc(userName(p.resp))+' pegou'}</b>`:''}${x.pay===null?' · cobra no fim do corte':''}</div>
      <div class="acts">${acao}</div></div>`; };
  const lane = (st, titulo, vazio) => `<section class="lane"><h4><span>${titulo}</span><span class="c num">${col(st).length}</span></h4>${col(st).map(card).join('') || `<div class="empty" style="padding:20px 8px">${vazio}</div>`}</section>`;
  v.innerHTML = `
    <div class="head"><div><h1>Pedidos</h1><p>${ab.length?`${plural(ab.length,'pedido','pedidos')} em aberto`:'Nenhum pedido em aberto'} · ${me.pedidos?'você recebe os pedidos do bar':'acompanhe o que o bar está preparando'}</p></div>
      <div class="actions"><button class="btn pri" id="pd-new">${ICON.plus}Novo pedido</button></div></div>
    <div class="lanes ped-lanes">${lane('novo','Novos','Nada novo.')}${lane('preparando','Preparando','Ninguém preparando.')}${lane('pronto','Prontos para levar','Nada esperando.')}</div>
    <section class="card"><div class="card-h"><h2>Entregues</h2><span class="psub">${entregues.length?'os mais recentes':'nenhum ainda'}</span></div>
      <div class="list">${entregues.map(x=>`<div class="li"><span class="time num" style="font-size:16px;width:50px">${hm(x.pedido.ts.entregue)}</span><div class="grow"><div class="t">${esc(itensTxt(x))}</div><div class="d">${esc(x.pedido.local)}${x.pedido.resp?` · ${esc(userName(x.pedido.resp))}`:''} · ${Math.max(1,Math.round((x.pedido.ts.entregue-x.pedido.ts.novo)/60e3))} min do pedido à entrega</div></div></div>`).join('') || '<div class="empty">Os pedidos entregues aparecem aqui.</div>'}</div></section>`;

/* ---------- aviso de pedido novo para quem cuida do bar ---------- */
const conhecidos = new Set([...DB.vendas.filter(v=>v.pedido).map(v=>v.id), ...DB.bookings.map(b=>b.id)]);
function beep(){
  try{ const c = window._ac || (window._ac = new (window.AudioContext||window.webkitAudioContext)()); [0,.18].forEach(d=>{ const o = c.createOscillator(), g = c.createGain(); o.frequency.value = 880; g.gain.setValueAtTime(.0001,c.currentTime+d); g.gain.exponentialRampToValueAtTime(.25,c.currentTime+d+.02); g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+d+.15); o.connect(g); g.connect(c.destination); o.start(c.currentTime+d); o.stop(c.currentTime+d+.16); }); }catch(e){}
  try{ navigator.vibrate && navigator.vibrate([150,80,150]); }catch(e){}
}
function avisarNovos(silencioso){
  const me = currentUser();
  const novos = DB.vendas.filter(v=>v.pedido && v.pedido.status==='novo' && !conhecidos.has(v.id));
  novos.forEach(v=>conhecidos.add(v.id));
  const reservas = DB.bookings.filter(b=>b.origem==='cliente' && b.status==='agendado' && !conhecidos.has(b.id));
  reservas.forEach(b=>conhecidos.add(b.id));
  if(silencioso || !me) return;
  if(novos.length && me.pedidos){ beep(); toast(`Pedido novo · ${novos[0].pedido.local}: ${itensTxt(novos[0])}`); return; }
  const minhas = reservas.filter(b=>me.papel==='dono' || b.barber===me.id);
  if(minhas.length){ beep(); toast(`Novo horário marcado pelo cliente · ${minhas[0].cliente}, ${dayLabel(minhas[0].date).toLowerCase()} às ${minhas[0].time}`); }
}
// Modo demonstração: outra aba no mesmo aparelho lançou algo, atualiza a tela na hora
function sincronizar(){
  if(oficial()) return;
  let raw = null; try{ raw = localStorage.getItem(KEY_DEMO); }catch(e){ return; }
  if(!raw || raw===ultimoSalvo) return;
  try{ const d = JSON.parse(raw); if(d && d.ver===4){ DB = d; ultimoSalvo = raw; avisarNovos(); if(!document.querySelector('.modal-bg')) render(); } }catch(e){}
}
window.addEventListener('storage', e=>{ if(e.key===KEY_DEMO) sincronizar(); });
setInterval(()=>{ sincronizar(); if(UI.route==='pedidos' && currentUser() && !document.querySelector('.modal-bg') && UI.mode==='app' && !oficial()) renderPedidos(); }, 15000);

// Contagem: digita a quantidade real de cada item; o app grava só as diferenças como ajuste
function contagemDialog(setor){
  let st = setor;
  const corpo = () => `<div class="seg" id="ct-s">${Object.entries(SETOR).map(([k,l])=>`<button type="button" data-v="${k}" class="${st===k?'on':''}">${l}</button>`).join('')}</div>
    <p class="psub" style="margin:0">Digite quanto tem de cada item agora. Só o que mudar é registrado, com o seu nome.</p>
    <div class="list" id="ct-l">${DB.produtos.filter(p=>p.setor===st).sort((a,b)=>a.nome.localeCompare(b.nome)).map(p=>`<div class="li"><div class="grow"><div class="t">${esc(p.nome)}</div><div class="d">agora: ${fmtQ(p.qtd)} ${esc(p.unid)}</div></div><input class="in num ct-in" style="width:110px;text-align:right" inputmode="decimal" data-p="${p.id}" value="${fmtQ(p.qtd)}" aria-label="Quantidade de ${esc(p.nome)}"><span class="psub" style="width:48px">${esc(p.unid)}</span></div>`).join('')}</div>`;
  const pend = {};
  modal({title:'Contagem do estoque', wide:true, body:`<div id="ct-b" class="stack" style="gap:14px">${corpo()}</div>`,
    foot:`<button class="btn" data-x>Fechar</button><button class="btn pri" id="ct-ok">Salvar contagem</button>`,
    onMount:(el,close)=>{
      const lerAtuais = () => el.querySelectorAll('.ct-in').forEach(i=>{ pend[i.dataset.p] = i.value; });
      const bind = () => { segBind(el,'#ct-s',x=>{ lerAtuais(); st = x; $('#ct-b',el).innerHTML = corpo(); el.querySelectorAll('.ct-in').forEach(i=>{ if(pend[i.dataset.p]!==undefined) i.value = pend[i.dataset.p]; }); bind(); }); };
      bind();
      $('#ct-ok',el).onclick = () => {
        lerAtuais(); const ms = [];
        Object.entries(pend).forEach(([id,val])=>{ const p = prod(id); if(!p || String(val).trim()==='') return; const novo = numIn(val); const d = Math.round((novo - p.qtd)*100)/100; if(d) ms.push(moveStock(id, d, 'Contagem do estoque')); });
        save(); close(); refresh();
        toast(ms.length ? `Contagem salva · ${plural(ms.length,'item ajustado','itens ajustados')}` : 'Nada mudou na contagem', ms.length ? ()=>{ undoMoves(ms); save(); refresh(); } : null);
      };
    }});
}
function itemDialog(id){

  modal({title:p.nome, body:`
    <div class="msum"><span class="psub">${SETOR[p.setor]} · mínimo ${fmtQ(p.min)} ${esc(p.unid)}</span><span class="big num">${fmtQ(p.qtd)} ${esc(p.unid)}</span></div>

    onMount:(el,close)=>{

      const upd = () => { $('#it-o',el).innerHTML = motivos().map(m=>`<option>${m}</option>`).join(''); const q = numIn(qi.value); $('#it-r',el).textContent = `Fica com ${fmtQ(Math.max(0, p.qtd+(modo==='entrada'?q:-q)))} ${p.unid}.`; $('#it-ok',el).textContent = modo==='entrada'?'Registrar entrada':'Registrar baixa'; };
      segBind(el,'#it-m',x=>{ modo=x; upd(); });

      qi.oninput = () => { const q = numIn(qi.value); $('#it-r',el).textContent = `Fica com ${fmtQ(Math.max(0, p.qtd+(modo==='entrada'?q:-q)))} ${p.unid}.`; };

        const q = numIn(qi.value);

        if(modo==='saida' && q>p.qtd){ $('#it-err',el).textContent=`Só há ${fmtQ(p.qtd)} ${p.unid} em estoque.`; return; }
        const m = moveStock(p.id, modo==='entrada'?q:-q, $('#it-o',el).value);
        save(); close(); refresh();
        toast(`${modo==='entrada'?'Entrada':'Baixa'} de ${fmtQ(q)} ${p.unid} · ${p.nome}`, ()=>{ undoMoves([m]); save(); refresh(); });
      };
    }});

      <section class="card"><div class="card-h"><h2>Narga</h2></div>
        <p class="psub" style="margin:-4px 0 12px">Preço da sessão e o que cada sessão tira do estoque.</p>
        <div class="grid2"><label class="f">Preço da sessão (R$)<input class="in num" id="ng-p" inputmode="decimal" value="${String(n.preco).replace('.',',')}"></label><label class="f">Essência por sessão (g)<input class="in num" id="ng-e" inputmode="decimal" value="${String(n.ess).replace('.',',')}"></label></div>
        <div class="grid2" style="margin-top:12px"><label class="f">Carvão por sessão (cubos)<input class="in num" id="ng-c" inputmode="numeric" value="${n.carvao}"></label><label class="f">Piteiras por sessão<input class="in num" id="ng-t" inputmode="numeric" value="${n.piteira}"></label></div>
        <div style="margin-top:12px"><button class="btn pri" id="ng-ok">Salvar narga</button></div></section>
      <div class="stack">
        <section class="card"><div class="card-h"><h2>Agendamento do cliente</h2></div>
          <p class="psub" style="margin:-4px 0 12px">O cliente escolhe serviço, barbeiro e horário livre, e o horário cai na agenda. Coloque este link na bio do Instagram e na resposta automática do WhatsApp.</p>
          <input class="in num" id="lk-cli" readonly value="${esc(linkCli)}">
          <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="btn" id="lk-copy">Copiar link</button><button class="btn" id="lk-open">${ICON.link}Ver como o cliente vê</button></div></section>
        <section class="card"><div class="card-h"><h2>Celulares da casa</h2>${oficial()?'<span class="pill ok nodot">Conectado</span>':'<span class="pill mute nodot">Demonstração</span>'}</div>
          ${oficial()?`<p class="psub" style="margin:-4px 0 12px">Para usar o app em outro celular, mande este link para a pessoa. Ela abre uma vez, o celular fica conectado à casa e depois ela entra com o próprio usuário e senha. Mande só para a equipe.</p>
          <input class="in num" id="lk-con" readonly value="${esc(linkCon)}">
          <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="btn" id="con-copy">Copiar link</button><a class="btn" id="con-wpp" href="https://wa.me/?text=${encodeURIComponent('Link do app da Barba & Narga (abra uma vez para conectar seu celular): '+linkCon)}" target="_blank" rel="noopener">Enviar pelo WhatsApp</a></div>
          <button class="btn ghost danger" id="con-sair" style="margin-top:10px">Desconectar este aparelho</button>`
          :`<p class="psub" style="margin:-4px 0 0">Este aparelho está no modo demonstração: os dados são de exemplo, ficam só aqui e voltam ao início todo dia. Para usar com os dados da casa, abra o link de conexão que o dono compartilha.</p>`}</section>
      </div>
    </div>`;
  $('#us-new').onclick = () => userDialog(null);
  v.querySelectorAll('[data-us]').forEach(r=>r.onclick=()=>userDialog(r.dataset.us));
  $('#sv-new').onclick = () => svcDialog(null);
  v.querySelectorAll('[data-sv]').forEach(b=>b.onclick=()=>svcDialog(b.dataset.sv));
  $('#lk-open').onclick = openCliente;
  $('#lk-copy').onclick = () => { copiar(linkCli, $('#lk-cli')); if(oficial()) marcarPasso('link'); };
  if($('#con-copy')) $('#con-copy').onclick = () => { copiar(linkCon, $('#lk-con')); marcarPasso('celulares'); };
  if($('#con-wpp')) $('#con-wpp').addEventListener('click', ()=>marcarPasso('celulares'));
  if($('#con-sair')) $('#con-sair').onclick = () => confirmBox('Desconectar este aparelho?', 'O app sai da sua conta neste celular e volta para a demonstração. Os dados da casa continuam salvos. Para voltar, abra o link de conexão.', 'Desconectar', ()=>{ try{ localStorage.removeItem(KEY_SEG); localStorage.removeItem(KEY_OF); localStorage.removeItem(KEY_SESS); }catch(e){} location.replace(linkBase()); });
  const toggles = sel => { const set = new Set(); v.querySelectorAll(sel+' [data-d]').forEach(b=>{ if(b.classList.contains('on')) set.add(+b.dataset.d); b.onclick=()=>{ const i = +b.dataset.d; set.has(i)?set.delete(i):set.add(i); b.classList.toggle('on',set.has(i)); b.setAttribute('aria-pressed',String(set.has(i))); }; }); return set; };
  const dias = toggles('#lg-d'), fech = toggles('#hf-d');
  $('#lg-ok').onclick = () => {
    const ini = $('#lg-i').value, fim = $('#lg-f').value;
    if(!dias.size){ toast('Escolha pelo menos um dia de lounge'); return; }
    if(!ini || !fim){ toast('Preencha o horário de começo e de fim'); return; }
    const prev = {...loungeCfg()};
    DB.cfg.lounge = {dias:[...dias], inicio:ini, fim};
    save(); refresh(); toast(`Lounge: ${regraLounge()}`, ()=>{ DB.cfg.lounge = prev; save(); refresh(); });
  };
  $('#hf-ok').onclick = () => {
    const a = $('#hf-a').value, f = $('#hf-f').value;
    if(!a || !f || toMin(f) <= toMin(a)){ toast('O horário de fechar precisa ser depois do de abrir'); return; }
    if(fech.size >= 7){ toast('Deixe pelo menos um dia aberto'); return; }
    const prev = DB.cfg.horario ? {...DB.cfg.horario} : null;
    DB.cfg.horario = {abre:a, fecha:f, fechado:[...fech]};
    save(); refresh(); toast('Horário de funcionamento salvo', ()=>{ if(prev) DB.cfg.horario = prev; else delete DB.cfg.horario; save(); refresh(); });
  };
  $('#ng-ok').onclick = () => {
    const d = {preco:numIn($('#ng-p').value), ess:numIn($('#ng-e').value), carvao:Math.round(numIn($('#ng-c').value)), piteira:Math.round(numIn($('#ng-t').value))};
    if(d.preco<=0 || d.ess<=0){ toast('Preço e essência precisam ser maiores que zero'); return; }
    const prev = DB.cfg.narga ? {...DB.cfg.narga} : null;
    DB.cfg.narga = d; save(); refresh(); toast('Narga salva', ()=>{ if(prev) DB.cfg.narga = prev; else delete DB.cfg.narga; save(); refresh(); });
  };
}
function userDialog(id){
  const me = currentUser(), self = id===me.id;
  const novo = !id;
  const u = id ? DB.users.find(x=>x.id===id) : {id:uid(), nome:'', usuario:'', papel:'funcionario', funcao:'Barbeiro', com:50, ativo:true, barbeiro:true, pedidos:false};
  let papel = u.papel;
  modal({title: novo?'Novo login':'Editar login', body:`
    <div class="grid2"><label class="f">Nome<input class="in" id="u-n" value="${esc(u.nome)}"></label><label class="f">Função<input class="in" id="u-f" value="${esc(u.funcao)}" placeholder="Barbeiro, Lounge e bar, Gerente"></label></div>
    <div class="grid2"><label class="f">Usuário para entrar<input class="in" id="u-u" autocapitalize="none" value="${esc(u.usuario)}"></label>
      <label class="f">${novo?'Senha':'Nova senha'}<input class="in" id="u-s" type="password" autocomplete="new-password" placeholder="${novo?'mínimo 6 caracteres':'deixe em branco para manter'}"></label></div>
    <div class="f"><span class="psub" style="font-weight:600">Tipo de acesso</span><div class="seg" id="u-p"><button type="button" data-v="funcionario" class="${papel==='funcionario'?'on':''}" ${self?'disabled':''}>Funcionário</button><button type="button" data-v="dono" class="${papel==='dono'?'on':''}">Dono</button></div>
      ${self?'<span class="note">Você não pode tirar o seu próprio acesso de dono.</span>':''}</div>
    <label class="check"><input type="checkbox" id="u-bb" ${isBarber(u)?'checked':''}> Atende clientes na agenda (aparece como barbeiro)</label>
    <label class="f" id="u-cw">Comissão sobre serviços (%)<input class="in num" id="u-c" inputmode="numeric" value="${u.com||0}"></label>
    <label class="check"><input type="checkbox" id="u-ped" ${u.pedidos?'checked':''}> Recebe os pedidos do bar (abre na fila e avisa quando chega pedido)</label>
    ${!novo&&!self?`<label class="check"><input type="checkbox" id="u-a" ${u.ativo?'checked':''}> Acesso ativo</label>`:''}
    <div class="err" id="u-err"></div>`,
    foot:`<button class="btn" data-x>Voltar</button><button class="btn pri" id="u-ok">Salvar</button>`,
    onMount:(el,close)=>{
      segBind(el,'#u-p',x=>papel=x);
      const cw = () => { $('#u-cw',el).hidden = !$('#u-bb',el).checked; }; $('#u-bb',el).onchange = cw; cw();
      $('#u-ok',el).onclick=async ()=>{
        const senha = $('#u-s',el).value;
        const d = {nome:$('#u-n',el).value.trim(), funcao:$('#u-f',el).value.trim()||'Funcionário', usuario:$('#u-u',el).value.trim().toLowerCase(), com:Math.round(numIn($('#u-c',el).value)), papel, pedidos:$('#u-ped',el).checked, barbeiro:$('#u-bb',el).checked};
        if(!d.nome || !d.usuario){ $('#u-err',el).textContent='Preencha nome e usuário.'; return; }
        if(!/^[a-z0-9._-]{3,30}$/.test(d.usuario)){ $('#u-err',el).textContent='Usuário com 3 a 30 letras ou números, sem espaço.'; return; }
        if(novo || senha){ if(senha.length < (oficial()?6:4)){ $('#u-err',el).textContent=`A senha precisa de pelo menos ${oficial()?6:4} caracteres.`; return; } }
        if(DB.users.some(x=>x.usuario===d.usuario && x.id!==u.id)){ $('#u-err',el).textContent='Esse usuário já existe. Escolha outro.'; return; }
        if(senha){ if(oficial()){ d.hash = await hashSenha(u.id, senha); delete u.senha; } else d.senha = senha; }
        if(novo) DB.users.push({...u, ...d}); else { Object.assign(u,d); if($('#u-a',el)) u.ativo = $('#u-a',el).checked; }
        save(); close(); refresh(); toast(novo?`Login de ${d.nome} criado`:'Login salvo');
      };
    }});
}
function svcDialog(id){
  const s = id ? SV(id) : {nome:'',preco:0,dur:30};
  modal({title:id?'Editar serviço':'Novo serviço', body:`
    <label class="f">Nome<input class="in" id="sv-n" value="${esc(s.nome)}" placeholder="Ex.: Corte infantil"></label>
    <div class="grid2"><label class="f">Preço (R$)<input class="in num" id="sv-p" inputmode="decimal" value="${String(s.preco).replace('.',',')}"></label>
    <label class="f">Duração<select class="in" id="sv-d">${[30,60,90,120].map(d=>`<option value="${d}" ${s.dur===d?'selected':''}>${d} min</option>`).join('')}</select></label></div>
    <div class="err" id="sv-err"></div>`,
    foot:`<button class="btn" data-x>Voltar</button><button class="btn pri" id="sv-ok">Salvar</button>`,
    onMount:(el,close)=>{ $('#sv-ok',el).onclick=()=>{ const n = $('#sv-n',el).value.trim(); if(!n){ $('#sv-err',el).textContent='Dê um nome ao serviço.'; return; }
      const d = {nome:n, preco:numIn($('#sv-p',el).value), dur:+$('#sv-d',el).value};
      if(id) Object.assign(s,d); else DB.services.push({id:uid(),...d}); save(); close(); refresh(); toast('Serviço salvo'); }; }});
}

/* =========================================================
   PÁGINA DO CLIENTE: serviço → barbeiro → horário → dados
   ========================================================= */
let CLI;
// Página pública (celular do cliente): fala direto com a nuvem e só vê horários livres.
// No celular da equipe (ou na demonstração) usa os dados do próprio app.
let PUB = null;
function resetCli(){ CLI = {step:0, service:null, barber:'any', date:null, time:null, nome:'', tel:'', done:null, publico:temNuvem() && !oficial(), enviando:false}; }
resetCli();
const cliHoje = () => (CLI.publico && PUB && PUB.agora) ? PUB.agora.slice(0,10) : TODAY;
const cliAgoraMin = () => { if(CLI.publico && PUB && PUB.agora) return toMin(PUB.agora.slice(11,16)); const n = new Date(); return n.getHours()*60+n.getMinutes(); };
const cliServices = () => CLI.publico ? ((PUB && PUB.services) || []) : DB.services;
const cliBarbers = () => CLI.publico ? ((PUB && PUB.barbeiros) || []) : barbers();
const cliSV = id => cliServices().find(s=>s.id===id) || {nome:'Serviço', preco:0, dur:30};
const cliNome = id => (cliBarbers().find(b=>b.id===id)||{}).nome || '—';
function cliFechado(date){
  const h = CLI.publico ? {...HORARIO_PADRAO, ...((PUB && PUB.horario)||{})} : H;
  return (h.fechado||[]).includes(parse(date).getDay());
}
function cliSlots(date, barber, dur){
  if(!CLI.publico) return freeSlots(date, barber, dur);
  const h = {...HORARIO_PADRAO, ...((PUB && PUB.horario)||{})};
  if((h.fechado||[]).includes(parse(date).getDay())) return [];
  const busy = ((PUB && PUB.ocupados)||[]).filter(o=>o.date===date && o.barber===barber).map(o=>[toMin(o.time), toMin(o.time)+(o.dur||30)]);
  const hoje = cliHoje(), agora = cliAgoraMin(), out = [];
  for(let t=toMin(h.abre); t+dur<=toMin(h.fecha); t+=30) out.push({t:toT(t), ok: !busy.some(([a,b])=>t<b && t+dur>a) && !(date===hoje && t<agora)});
  return out;
}
async function carregarPub(){
  try{ PUB = await rpc('agenda_publica', {p_casa:NUVEM.casa}); PUB.erro = null; }
  catch(e){ PUB = {...(PUB||{}), erro:e}; }
  drawCli();
}
function openCliente(){ resetCli(); UI.mode='cliente'; try{ history.replaceState(null,'','#agendar'); }catch(e){} render(); window.scrollTo(0,0); }
function closeCliente(){ UI.mode='app'; try{ history.replaceState(null,'',location.pathname+(UI.route?'#'+UI.route:'')); }catch(e){} render(); window.scrollTo(0,0); }
function clientePageHTML(){
  return `<div class="cli-page"><div class="cli-wrap"><div class="cli-top"><img src="${LOGO}" alt="Barba &amp; Narga · Club Secreto"><span class="label">Agende seu horário</span></div><div id="cli"></div>
    ${CLI.publico && !currentUser() ? '' : `<button class="backlink" id="cli-exit" style="align-self:center">${currentUser()?'Voltar ao app da equipe':'Área da equipe'}</button>`}</div></div>`;
}
function drawCli(){
  const el = $('#cli'); if(!el) return;
  const c = CLI;
  if($('#cli-exit')) $('#cli-exit').onclick = closeCliente;
  if(c.publico && !PUB){ el.innerHTML = `<div class="cli" style="align-items:center"><div class="spin"></div><p class="psub">Carregando os horários…</p></div>`; carregarPub(); return; }
  if(c.publico && PUB.erro && !PUB.services){ el.innerHTML = `<div class="cli"><h2>Sem conexão</h2><p class="psub" style="margin:0">Não foi possível carregar os horários. Confira a internet e tente de novo.</p><button class="btn pri block" id="cl-retry">Tentar de novo</button></div>`; $('#cl-retry').onclick = ()=>{ PUB = null; drawCli(); }; return; }
  if(!c.date){ c.date = cliHoje(); for(let i=0;i<7 && cliFechado(c.date);i++) c.date = iso(addDays(parse(cliHoje()),i+1)); }
  if(c.done){ const b = c.done;
    el.innerHTML = `<div class="cli"><span class="label">Tudo certo</span><h2>Horário confirmado</h2>
      <dl class="kv"><dt>Serviço</dt><dd>${esc(cliSV(b.service).nome)}</dd><dt>Barbeiro</dt><dd>${esc(cliNome(b.barber))}</dd><dt>Quando</dt><dd>${dayLabel(b.date)} às ${b.time}</dd><dt>Valor</dt><dd>${brl(b.valor)}</dd><dt>Nome</dt><dd>${esc(b.cliente)}</dd></dl>
      <p class="psub" style="margin:0">Chegue 5 minutos antes e aproveite o lounge enquanto espera. Se precisar remarcar, chame a gente no WhatsApp.</p>
      <button class="btn pri block" id="cl-again">Agendar outro horário</button></div>`;
    $('#cl-again').onclick = ()=>{ resetCli(); if(PUB) PUB = null; drawCli(); }; return; }
  const steps = `<div class="steps">${[0,1,2,3].map(i=>`<i class="${i<=c.step?'on':''}"></i>`).join('')}</div>`;
  const back = c.step>0 ? `<button class="backlink" id="cl-back">← Voltar</button>` : '';
  let b = '';
  if(!cliServices().length || !cliBarbers().length) b = `<h2>Agenda indisponível</h2><p class="psub" style="margin:0">A agenda online ainda não foi aberta. Chame a gente no WhatsApp para marcar.</p>`;
  else if(c.step===0) b = `<h2>Qual serviço?</h2><div class="stack" style="gap:8px">${cliServices().map(s=>`<button class="svc" data-s="${s.id}"><div class="g"><b>${esc(s.nome)}</b><span>${s.dur} min</span></div><span class="pr num">${brl(s.preco)}</span></button>`).join('')}</div>`;
  else if(c.step===1) b = `<h2>Com quem?</h2><div class="stack" style="gap:8px"><button class="svc" data-b="any"><span class="avatar">★</span><div class="g"><b>Primeiro disponível</b><span>Mostra todos os horários livres</span></div></button>${cliBarbers().map(u=>`<button class="svc" data-b="${u.id}"><span class="avatar">${initial(u.nome)}</span><div class="g"><b>${esc(u.nome)}</b><span>Barbeiro</span></div></button>`).join('')}</div>`;
  else if(c.step===2){
    const dur = cliSV(c.service).dur, pool = c.barber==='any' ? cliBarbers().map(u=>u.id) : [c.barber];
    const by = pool.map(id=>cliSlots(c.date,id,dur)); const sl = (by[0]||[]).map((s,i)=>({t:s.t, ok:by.some(a=>a[i] && a[i].ok)}));
    const h0 = parse(cliHoje());
    b = `<h2>Quando?</h2><div class="days">${[...Array(7)].map((_,i)=>{ const d = iso(addDays(h0,i)), x = parse(d); return `<button class="day ${d===c.date?'on':''}" data-d="${d}" ${cliFechado(d)?'disabled':''}><span>${d===cliHoje()?'hoje':DOW[x.getDay()]}</span><b class="num">${x.getDate()}</b></button>`; }).join('')}</div>
      ${sl.some(s=>s.ok)?`<div class="slots">${sl.map(s=>`<button class="slot num ${c.time===s.t?'on':''}" data-t="${s.t}" ${s.ok?'':'disabled'}>${s.t}</button>`).join('')}</div>`:`<div class="empty">${sl.length?'Sem horário livre neste dia. Escolha outra data.':'Fechado neste dia. Escolha outra data.'}</div>`}
      <button class="btn pri block" id="cl-next" ${c.time?'':'disabled'}>Continuar</button>`;
  } else b = `<h2>Seus dados</h2>
      <div class="msum"><div><b>${esc(cliSV(c.service).nome)}</b><div class="psub">${dayLabel(c.date)} às ${c.time} · ${c.barber==='any'?'primeiro disponível':esc(cliNome(c.barber))}</div></div><span class="big num">${brl(cliSV(c.service).preco)}</span></div>
      <label class="f">Nome<input class="in" id="cl-n" autocomplete="name" value="${esc(c.nome)}" placeholder="Como te chamamos?"></label>
      <label class="f">WhatsApp<input class="in" id="cl-t" inputmode="tel" autocomplete="tel" value="${esc(c.tel)}" placeholder="(21) 99999-9999"></label>
      <div class="err" id="cl-err"></div>
      <button class="btn pri block" id="cl-ok" ${c.enviando?'disabled':''}>${c.enviando?'Confirmando…':'Confirmar agendamento'}</button>`;
  el.innerHTML = `<div class="cli">${steps}${back}${b}</div>`;
  if($('#cl-back')) $('#cl-back').onclick = ()=>{ c.step--; drawCli(); };
  el.querySelectorAll('[data-s]').forEach(x=>x.onclick=()=>{ c.service=x.dataset.s; c.step=1; drawCli(); });
  el.querySelectorAll('[data-b]').forEach(x=>x.onclick=()=>{ c.barber=x.dataset.b; c.time=null; c.step=2; drawCli(); });
  el.querySelectorAll('[data-d]').forEach(x=>x.onclick=()=>{ c.date=x.dataset.d; c.time=null; drawCli(); });
  el.querySelectorAll('[data-t]').forEach(x=>x.onclick=()=>{ c.time=x.dataset.t; drawCli(); });
  if($('#cl-next')) $('#cl-next').onclick = ()=>{ c.step=3; drawCli(); };
  if($('#cl-ok')) $('#cl-ok').onclick = async ()=>{
    c.nome = $('#cl-n').value.trim(); c.tel = $('#cl-t').value.trim();
    if(!c.nome){ $('#cl-err').textContent='Escreva o seu nome.'; return; }
    if(c.tel.replace(/\D/g,'').length<10){ $('#cl-err').textContent='Informe o WhatsApp com DDD.'; return; }
    const sv = cliSV(c.service); let bb = c.barber;
    if(bb==='any'){ const livre = cliBarbers().find(u=>{ const s = cliSlots(c.date,u.id,sv.dur).find(x=>x.t===c.time); return s && s.ok; }); if(!livre){ $('#cl-err').textContent='Esse horário acabou de ser ocupado. Escolha outro.'; c.time = null; c.step = 2; setTimeout(drawCli, 1200); return; } bb = livre.id; }
    const bk = {id:uid(),date:c.date,time:c.time,barber:bb,cliente:c.nome,tel:c.tel,service:sv.id,valor:sv.preco,status:'agendado',origem:'cliente'};
    if(!c.publico){ DB.bookings.push(bk); save(); c.done = bk; drawCli(); return; }
    c.enviando = true; drawCli();
    try{
      const r = await rpc('agendar', {p_casa:NUVEM.casa, p_reserva:bk});
      bk.valor = (r && r.valor!=null) ? +r.valor : bk.valor; c.done = bk;
    }catch(e){
      const m = String(e.message||'');
      c.enviando = false; PUB = null;
      const msg = /ocupado/.test(m) ? 'Esse horário acabou de ser ocupado. Escolha outro.' : /passou|fora|fechado|periodo/.test(m) ? 'Esse horário não está mais disponível. Escolha outro.' : /dados/.test(m) ? 'Confira seu nome e WhatsApp.' : 'Não foi possível confirmar agora. Confira a internet e tente de novo.';
      if(/ocupado|passou|fora|fechado|periodo/.test(m)){ c.time = null; c.step = 2; }
      await carregarPub(); const er = $('#cl-err') || (()=>{ const d = document.createElement('div'); d.className='err'; $('#cli .cli').appendChild(d); return d; })(); er.textContent = msg; return;
    }
    c.enviando = false; drawCli();
  };
}
let _rz; window.addEventListener('resize', ()=>{ clearTimeout(_rz); _rz = setTimeout(()=>{ const el = $('#ch'); if(el) drawChart(el, datasDo(UI.rng)); },150); });

render();
